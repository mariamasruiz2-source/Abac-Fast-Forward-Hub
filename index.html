<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abac Fast Forward · Hub</title>
<style>
  :root{color-scheme:light;
    --navy:#0F2233;--navy2:#1B3346;--navy3:#2A4459;--blue:#3D5D78;--blue2:#5C7A93;--cyan:#0F6E7A;--cyan2:#2E97A3;
    --gold:#AFB6BD;
    --ink:#141B23;--body:#3C4A59;--muted:#8792A0;--faint:#AEB7C2;
    --line:#E3E9F1;--line2:#EDF1F7;--page1:#F6F8FB;--page2:#EDF0F6;
    --display:'Segoe UI Semibold','Segoe UI',system-ui,-apple-system,sans-serif;
    --sans:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,monospace;
    --r:10px;--r2:13px;
    --sh:none;
    --sh2:0 1px 2px rgba(20,24,29,.05),0 6px 18px rgba(20,24,29,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;font-size:14px;
    background:radial-gradient(1200px 480px at 50% -10%,rgba(46,109,168,.07),transparent 60%),linear-gradient(180deg,var(--page1),var(--page2));background-attachment:fixed;min-height:100vh}
  ::selection{background:rgba(20,157,175,.22)}

  /* ---------- HEADER ---------- */
  .hdr{position:sticky;top:0;z-index:40;background:#0F2233;padding:16px 30px 0;box-shadow:none}
  .hdr::after{content:"";display:block;height:1px;margin:0 -30px;background:rgba(255,255,255,.08)}
  .hdr-inner{max-width:1320px;margin:0 auto}
  .brandrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:-0.03em;color:#fff;line-height:1}
  .lockdiv{width:1px;height:32px;background:rgba(255,255,255,.22)}
  .prod{font-family:var(--display);font-weight:500;font-size:14.5px;color:#EAF1F8;line-height:1.1;letter-spacing:.01em}
  .subt{font-family:var(--mono);font-size:8.5px;letter-spacing:.24em;text-transform:uppercase;color:#7E9BBA;margin-top:4px}
  .sync{display:flex;align-items:center;gap:8px;font-size:10px;color:#93AAC3;font-family:var(--mono);letter-spacing:.02em}
  .sync .led{width:7px;height:7px;border-radius:99px;background:#F0B429;box-shadow:0 0 8px rgba(240,180,41,.8)}
  .sync.ok .led{background:#3DDC97;box-shadow:0 0 8px rgba(61,220,151,.8)}
  .sync.err .led{background:#E86B6B}
  /* omnibox */
  .omni{position:relative;margin-left:auto;display:flex;align-items:center;gap:14px}
  .omni input{width:290px;max-width:44vw;padding:8px 16px 8px 34px;border-radius:99px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.06);color:#fff;font-size:12px;font-family:var(--sans);outline:none;transition:background .15s,border-color .15s}
  .omni input::placeholder{color:#7E96B2}
  .omni input:focus{background:rgba(255,255,255,.11);border-color:rgba(255,255,255,.34)}
  .omni svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}
  .omnidrop{position:absolute;top:calc(100% + 8px);right:0;width:420px;max-width:82vw;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:var(--sh2);display:none;z-index:60}
  .omnidrop.show{display:block}
  .omnigroup{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:11px 15px 5px}
  .omnirow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 15px;cursor:pointer;font-family:var(--sans)}
  .omnirow:hover{background:#FAFAF9}
  .omnirow .t{font-size:13px;font-weight:600;color:var(--navy2)}
  .omnirow .st{font-size:11px;color:var(--muted)}
  .tabs{display:flex;gap:2px;flex-wrap:wrap;margin-top:15px}
  .tab{position:relative;padding:12px 16px 14px;font-size:12.5px;border:0;border-radius:0;background:transparent;color:#93AAC3;letter-spacing:.015em;cursor:pointer;font-family:var(--display);font-weight:500;letter-spacing:.01em;transition:color .15s,background .15s}
  .tab:hover{color:#D8E4EF}
  .tab.on{background:transparent;color:#fff;font-weight:600}
  .tab.on::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--cyan2)}

  .wrap{padding:28px 28px 40px;max-width:1320px;margin:0 auto}
  section{animation:fade var(--t-slow) var(--ease)}
  @keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}

  /* ---------- TIPOGRAFIA DE SECCION ---------- */
  .kick{font-size:10.5px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:#5C8CBF;margin-bottom:12px}
  
  h1.s{font-family:var(--display);font-size:29px;margin:0 0 6px;font-weight:600;letter-spacing:-0.028em;color:var(--navy);line-height:1.15}
  p.lead{font-size:14px;line-height:1.75;color:var(--body);max-width:720px;margin:10px 0 24px}
  .seclab{font-size:10px;font-weight:600;letter-spacing:.19em;text-transform:uppercase;color:#5C8CBF;margin:24px 0 10px;display:flex;align-items:center;gap:8px}
  .seclab::after{content:"";flex:1;height:1px;background:var(--line2)}

  /* ---------- CONTROLES ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:22px 24px}
  textarea,input.tin,select.tin{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;font-family:var(--sans);font-size:13.5px;outline:none;resize:vertical;color:var(--ink);background:#fff;transition:border-color .15s,box-shadow .15s}
  select.tin{cursor:pointer;color:var(--body)}
  textarea:focus,input.tin:focus,select.tin:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,109,168,.12)}
  .btn{padding:9px 18px;border:0;border-radius:99px;background:var(--navy);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--display);letter-spacing:.01em;box-shadow:none;transition:background var(--t-fast) var(--ease-in),transform var(--t-fast) var(--ease-in)}
  .btn:hover{background:var(--navy2);transform:translateY(-1px)}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{border-color:#B6BCC4;background:#FAFAF9;color:var(--ink)}
  .btn.mini{padding:7px 15px;font-size:11.5px;border-radius:99px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .filtbtn{font-size:11.5px;padding:6px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;color:#5B6675;cursor:pointer;font-family:var(--sans);margin:0 5px 6px 0;font-weight:500;transition:all .13s;box-shadow:0 1px 2px rgba(11,36,64,.03)}
  .filtbtn:hover{border-color:#B9C9DA;color:var(--navy2)}
  .filtbtn.on{background:var(--ink);color:#fff;border-color:var(--ink);box-shadow:none}
  .searchbox{position:relative;max-width:520px;flex:1;min-width:240px}
  .searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4}
  .searchbox input{padding-left:40px}

  /* ---------- HERO / DASHBOARD ---------- */
  .hero{position:relative;overflow:hidden;border-radius:6px;padding:40px 44px 36px;color:#fff;
    background:#0F2233;box-shadow:none;margin-bottom:20px}
  .hero::before{content:"";position:absolute;inset:0;background:none}
  .hero::after{content:"";position:absolute;right:44px;top:0;bottom:0;width:1px;background:rgba(255,255,255,.07)}
  .hero>*{position:relative;z-index:1}
  .hero .kick{color:#8A9299}
  .hero .kick::before{background:currentColor;opacity:.6}
  .hero h1{font-family:var(--display);font-size:28px;line-height:1.2;margin:0 0 12px;font-weight:500;letter-spacing:-0.015em;color:#fff;max-width:720px}
  .hero p{font-size:13.5px;line-height:1.7;color:#A8AFB7;max-width:660px;margin:0}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0 4px}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px 19px 15px;cursor:pointer;transition:border-color .15s,background .15s}
  .stat:hover{border-color:#B9CCDF;background:#FCFDFE}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:0}
  .stat .v{font-family:var(--display);font-size:26px;font-weight:500;letter-spacing:-0.02em;color:var(--ink);font-variant-numeric:tabular-nums}
  .stat .l{font-size:12.5px;color:var(--body);margin-top:3px;font-weight:500}
  .stat .s{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:3px}
  .dashgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:900px){.dashgrid{grid-template-columns:1fr}}
  .dashgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:900px){.dashgrid2{grid-template-columns:1fr}}
  .chartcard{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:19px 21px 15px}
  .chartcard h3{margin:0 0 2px;font-family:var(--display);font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-0.005em}
  .chartcard .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .chartbox{position:relative;height:230px}
  .leader{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
  .leader:last-child{border-bottom:0}
  .leader:hover .t{color:var(--blue)}
  .leader .t{font-size:12.5px;font-weight:600;color:var(--navy2);width:150px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .leader .n{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:22px;text-align:right}
  .costrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .cochip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 8px;border-radius:3px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:500;color:var(--ink);transition:border-color .14s,background .14s}
  .cochip:hover{border-color:#C6CBD2;background:#FCFCFC}
  .cochip .cav{width:22px;height:22px;border-radius:3px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--display)}
  .cochip .np{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:500}


  /* ---------- BARRA DE FILTROS ---------- */
  .fbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid #E5E8EE;border-radius:14px;padding:13px 16px}
  .fsel{position:relative;display:inline-flex;align-items:center}
  .fsel select{appearance:none;-webkit-appearance:none;font-family:var(--sans);font-size:12px;color:var(--body);background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 26px 7px 11px;cursor:pointer;outline:none;transition:border-color .13s,color .13s;max-width:220px;text-overflow:ellipsis}
  .fsel select:hover{border-color:#B9C9DA}
  .fsel select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,109,168,.10)}
  .fsel.act select{background:var(--navy);color:#fff;border-color:var(--navy)}
  .fsel::after{content:"";position:absolute;right:10px;top:50%;width:5px;height:5px;border-right:1.4px solid currentColor;border-bottom:1.4px solid currentColor;transform:translateY(-70%) rotate(45deg);pointer-events:none;color:var(--muted);opacity:.85}
  .fsel.act::after{color:#fff;opacity:.9}
  .fsearch{position:relative;flex:1;min-width:190px}
  .fsearch input{width:100%;padding:8px 14px 8px 34px;border:1px solid var(--line);border-radius:99px;font-size:12.5px;font-family:var(--sans);outline:none;color:var(--ink);background:#fff}
  .fsearch input:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,109,168,.10)}
  .fsearch svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);opacity:.4}
  .fchips{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:10px;min-height:0}
  .fchip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:500;color:var(--navy);background:#EEF3F8;border:1px solid #DCE6F0;border-radius:99px;padding:4px 8px 4px 10px;cursor:pointer;font-family:var(--sans)}
  .fchip:hover{border-color:#B9C9DA}
  .fchip i{font-style:normal;color:var(--muted);font-size:13px;line-height:1}
  .fchip .k{color:var(--muted);font-weight:400}
  .fclear{font-size:11.5px;color:var(--blue);cursor:pointer;background:none;border:0;font-family:var(--sans);font-weight:600;padding:4px 2px}
  .fclear:hover{text-decoration:underline}
  .fcount{font-family:var(--mono);font-size:10.5px;color:var(--muted);letter-spacing:.04em;margin-left:auto}

  /* ---------- GRAFICOS NATIVOS ---------- */
  .gchart{display:flex;align-items:flex-end;gap:6px;height:186px;padding-top:6px}
  .gcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px;min-width:0}
  .gstack{width:100%;max-width:34px;display:flex;flex-direction:column-reverse;border-radius:2px;overflow:hidden;transition:opacity .14s}
  .gcol:hover .gstack{opacity:.72}
  .gseg{width:100%}
  .gx{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.04em}
  .gtot{font-family:var(--display);font-size:10.5px;color:var(--body);font-weight:600;font-variant-numeric:tabular-nums}
  .glegend{display:flex;gap:14px;flex-wrap:wrap;margin-top:12px;padding-top:11px;border-top:1px solid var(--line2)}
  .glegend span{display:inline-flex;align-items:center;gap:6px;font-size:11px;color:var(--body)}
  .glegend i{width:9px;height:9px;border-radius:1px;display:inline-block}
  .hbar{display:flex;align-items:center;gap:11px;padding:6px 0;cursor:pointer}
  .hbar:hover .hlab{color:var(--ink)}
  .hlab{width:132px;flex:0 0 auto;font-size:12px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .htrack{flex:1;height:14px;background:#F2F2F0;position:relative}
  .htrack i{position:absolute;left:0;top:0;bottom:0;display:block}
  .hnum{font-family:var(--mono);font-size:10.5px;color:var(--muted);min-width:22px;text-align:right;font-variant-numeric:tabular-nums}
  /* ---------- AGRUPACION DE PROYECTOS ---------- */
  .ghead{display:flex;align-items:baseline;gap:11px;margin:26px 0 11px;padding-bottom:8px;border-bottom:1px solid var(--line)}
  .ghead:first-child{margin-top:8px}
  .ghead .t{font-family:var(--display);font-size:14px;font-weight:600;color:var(--ink);letter-spacing:-0.005em}
  .ghead .n{font-family:var(--mono);font-size:10px;color:var(--muted);letter-spacing:.06em}
  .ghead .lnk{margin-left:auto;font-size:11.5px}

  /* ---------- DARK SPLIT HERO ---------- */
  .dhero{display:grid;grid-template-columns:1.15fr .85fr;gap:34px;align-items:center;background:#0F2233;border:1px solid #1B3346;border-radius:18px;padding:38px 40px;margin-bottom:14px}
  @media(max-width:900px){.dhero{grid-template-columns:1fr;gap:26px}}
  .dchip{display:inline-flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#6FD3DD;background:#0C3540;padding:5px 11px;border-radius:99px;letter-spacing:.01em}
  .ddot{width:6px;height:6px;border-radius:99px;background:#6FD3DD;display:inline-block}
  .dhero h1{font-family:var(--display);font-size:29px;font-weight:600;letter-spacing:-0.028em;line-height:1.22;color:#F4F8FC;margin:16px 0 0;max-width:520px}
  .dhero p{font-size:13.5px;line-height:1.75;color:#A9C0D6;margin:13px 0 0;max-width:490px}
  .dacts{display:flex;gap:9px;margin-top:22px;flex-wrap:wrap}
  .dbtn{font-family:var(--sans);font-size:12.5px;font-weight:600;padding:9px 16px;border-radius:99px;border:0;cursor:pointer;background:#F4F8FC;color:#0F2233;transition:.16s}
  .dbtn:hover{background:#fff;transform:translateY(-1px)}
  .dbtn.g{background:transparent;color:#B9CCDF;border:1px solid #29435C}
  .dbtn.g:hover{background:#16304A;color:#fff}
  .dmini{display:grid;grid-template-columns:1fr 1fr;gap:11px}
  .dm{background:#152B3E;border:1px solid #22415A;border-radius:13px;padding:15px 16px;transition:.16s}
  .dm:hover{border-color:#33587A}
  .dm .v{font-family:var(--display);font-size:25px;font-weight:600;letter-spacing:-0.025em;color:#F4F8FC;font-variant-numeric:tabular-nums}
  .dm .l{font-size:11.5px;color:#C2D5E6;margin-top:4px;font-weight:500}
  .dm .x{font-size:10.5px;color:#84A0BB;margin-top:2px}
  .dm.acc{background:#0B2D36;border-color:#14454F}
  .dm.acc .v,.dm.acc .l{color:#6FD3DD}
  .dm.acc .x{color:#4A9DA8}
  /* ---------- BENTO ---------- */
  .bento{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}
  @media(max-width:980px){.bento{grid-template-columns:repeat(2,1fr)}}
  .b1{grid-column:span 1}.b2{grid-column:span 2}.b3{grid-column:span 3}.b4{grid-column:span 4}
  @media(max-width:980px){.b3,.b4{grid-column:span 2}}
  .bcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:21px 23px;transition:border-color .16s}
  .bcard:hover{border-color:#B9CCDF}
  .bcard.ctr{display:flex;flex-direction:column;align-items:center;justify-content:center}
  .bcard h3{margin:0;font-family:var(--display);font-size:13.5px;font-weight:600;color:var(--ink);letter-spacing:-0.008em;text-wrap:balance}
  .bsub{font-size:11.5px;color:var(--muted);margin-top:3px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:10.5px;font-weight:600;color:#0E7C86;background:#E6F4F5;padding:4px 10px;border-radius:99px;white-space:nowrap}
  .cdot{width:5px;height:5px;border-radius:99px;background:#0E7C86;display:inline-block}
  .xax{display:flex;justify-content:space-between;font-family:var(--mono);font-size:9px;color:var(--muted);margin-top:5px;padding:0 3px}
  .arow{display:flex;align-items:center;gap:11px;padding:5px 0;cursor:pointer}
  .arow:hover .alab{color:var(--ink)}
  .alab{width:116px;font-size:11.5px;color:var(--body);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .atr{flex:1;height:7px;background:#F1F2F4;border-radius:99px;position:relative;overflow:hidden}
  .atr i{position:absolute;left:0;top:0;bottom:0;border-radius:99px}
  .aval{font-family:var(--mono);font-size:10.5px;color:var(--muted);width:21px;text-align:right}
  .prow{display:flex;align-items:center;gap:10px;padding:6px 0;cursor:pointer}
  .prow:hover .pnm{color:var(--blue)}
  .pav{width:26px;height:26px;border-radius:99px;background:#F1F2F4;color:#5B6470;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center;flex:0 0 auto;font-family:var(--display)}
  .pnm{width:124px;font-size:12px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptr{flex:1;height:6px;background:#F1F2F4;border-radius:99px;position:relative;overflow:hidden}
  .ptr i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:99px}
  .pval{font-family:var(--mono);font-size:10.5px;color:var(--muted);width:19px;text-align:right}
  .orow{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid #F3F4F6;cursor:pointer}
  .orow:last-child{border-bottom:0}
  .orow:hover .onm{color:var(--blue)}
  .odot{width:5px;height:5px;border-radius:99px;background:#0E7C86;flex:0 0 auto}
  .onm{font-size:12.5px;font-weight:500}
  .omt{font-size:11px;color:var(--muted);margin-top:2px}
  .oar{font-size:10px;font-weight:600;padding:3px 9px;border-radius:99px;white-space:nowrap}
  .mstat{display:flex;align-items:flex-start;gap:22px;margin-top:14px}
  .mv{font-family:var(--display);font-size:24px;font-weight:600;letter-spacing:-0.02em;font-variant-numeric:tabular-nums}
  .ml{font-size:11px;color:var(--muted);margin-top:2px}
  .mbar{height:7px;background:#F1F2F4;border-radius:99px;overflow:hidden;margin-top:9px}
  .mbar i{display:block;height:7px;background:#0E7C86;border-radius:99px}

  /* ---------- RECOMMENDER ---------- */

  /* ---------- MOTION SYSTEM ----------
     Curvas de salida rápidas, solo transform/opacity, y nada de movimiento
     si el sistema pide reducirlo. */
  :root{--ease:cubic-bezier(.16,1,.3,1);--ease-in:cubic-bezier(.4,0,.2,1);
        --t-fast:120ms;--t:180ms;--t-slow:280ms}
  @media (prefers-reduced-motion:reduce){
   *,*::before,*::after{animation-duration:.001ms !important;animation-iteration-count:1 !important;transition-duration:.001ms !important}
  }
  ::selection{background:rgba(15,110,122,.16)}
  :focus-visible{outline:2px solid var(--cyan);outline-offset:2px;border-radius:4px}
  button{-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(.985)}
  .op:active,.prj:active,.cobig:active,.stat:active{transform:scale(.995)}
  /* ---------- DROPDOWN ---------- */
  .dd{position:relative;display:inline-flex}
  .ddt{display:inline-flex;align-items:center;gap:8px;font-family:var(--sans);font-size:12px;
   background:#fff;border:1px solid var(--line);border-radius:99px;padding:7px 13px 7px 14px;cursor:pointer;
   color:var(--body);transition:border-color var(--t-fast) var(--ease-in),background var(--t-fast) var(--ease-in),box-shadow var(--t-fast) var(--ease-in);white-space:nowrap;max-width:250px}
  .ddt:hover{border-color:#B9CCDF;background:#FCFDFE}
  .dd.open .ddt{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,109,168,.10)}
  .dd.act .ddt{background:var(--navy);border-color:var(--navy);color:#fff}
  .dd.act .ddt:hover{background:var(--navy2)}
  .ddl{color:var(--muted);transition:color var(--t-fast) var(--ease-in)}
  .dd.act .ddl{color:#8FA9C4}
  .ddv{font-weight:600;overflow:hidden;text-overflow:ellipsis}
  .ddc{width:9px;height:9px;flex:0 0 auto;opacity:.5;transition:transform var(--t) var(--ease),opacity var(--t-fast) linear}
  .dd.open .ddc{transform:rotate(180deg);opacity:.8}
  .dd.act .ddc{opacity:.85}
  .ddp{position:absolute;top:calc(100% + 6px);left:0;min-width:100%;width:max-content;max-width:290px;max-height:298px;overflow-y:auto;
   background:#fff;border:1px solid var(--line);border-radius:12px;padding:5px;z-index:70;
   box-shadow:0 1px 2px rgba(15,34,51,.06),0 12px 32px rgba(15,34,51,.13);
   opacity:0;transform:translateY(-5px) scale(.985);transform-origin:top left;pointer-events:none;
   transition:opacity var(--t-fast) linear,transform var(--t) var(--ease)}
  .dd.open .ddp{opacity:1;transform:none;pointer-events:auto}
  .ddp.right{left:auto;right:0;transform-origin:top right}
  .ddi{display:flex;align-items:center;gap:9px;width:100%;text-align:left;font-family:var(--sans);font-size:12.5px;
   padding:8px 10px;border:0;border-radius:8px;background:none;color:var(--body);cursor:pointer;white-space:nowrap;
   transition:background var(--t-fast) linear,color var(--t-fast) linear}
  .ddi:hover,.ddi:focus-visible{background:#F5F9FC;color:var(--navy);outline:none}
  .ddi.sel{color:var(--navy);font-weight:600}
  .ddi .tick{width:13px;height:13px;flex:0 0 auto;opacity:0;transition:opacity var(--t-fast) linear}
  .ddi.sel .tick{opacity:1}
  .ddsep{height:1px;background:var(--line2);margin:5px 8px}

 Granyó, Sep-2015) and unfolds in three waves. First, the operating and talent foundations: a new logistics centre and WMS with Enric Peradejordi, union relations and talent mapping with Jesús García, and reporting with Karl Nitzsch. Following the 2018 Digital Day, Joan Pina builds the proprietary stack featured in the one-pager: King Kong (big data to expand the catalogue — 3x SKUs, updates 12x faster), Infostocks (automated procurement with intelligent daily POs), Metalbrain (a commercial engine that flags lost opportunities and declining accounts) and Changeover (real-time pricing intelligence). The outcome: from 3k to 9k SKUs available and catalogue cycles cut from 24 to 2 months.","metrics":[{"v":"3x","l":"SKU offering (3k → 9k)"},{"v":"12x","l":"Catalogue update speed"},{"v":"Daily","l":"Accurate POs recommended daily"},{"v":"+5k","l":"SKUs with pricing and trend visibility"}],"initiatives":[{"n":"King Kong","d":"Big data for catalogue expansion: one part → multiple car models at scale","p":"Joan Pina"},{"n":"Infostocks","d":"Automated procurement and demand planning with intelligent daily POs","p":"Joan Pina"},{"n":"Metalbrain","d":"Commercial engine: lost opportunities and declining accounts","p":"Joan Pina"},{"n":"Changeover","d":"Pricing intelligence: real-time positioning versus distributors","p":"Joan Pina"}]},{"id":"motocard","excel":"Motocard","name":"Motocard","sector":"Consumer · Online Retail","onePager":true,"tagline":"From retailer to digital leader: Southern Europe's #1 online motorcycle platform","desc":"Omnichannel multi-brand distributor of motorcycle riding gear and accessories.","arc":{"from":"2017 · Physical stores + basic website","to":"2025 · Digital leader with proprietary technology and an AI operating layer"},"narrative":"With 32 projects, Motocard is the portfolio company with the highest Fast Forward intensity. The story begins with the deal itself: pre-deal digital assessment by Elena Cusí and market analysis by Josep Granyó (2018). The first wave builds the foundations (ERP assessment by Rebecca Tresserres, marketing plan by Maria Parareda, digital board representation with Elena Cusí, Javi Osa and Pedro Esquivias). From 2020 Joan Pina leads the digital growth engine set out in the one-pager: social selling via WhatsApp, the get-local strategy, the Motochiara community, the Motocard app, Para Tu Moto and international expansion (integration of Italy, marketplaces with Yvonne Bayer). The most recent layer is AI: smart pricing (Aquiles, and ML with Carolina de la Calzada), an RFM model for CRM and a chatbot with 66% of conversations fully self-served. Outcome: online revenue up 4.8x and international revenue up 4.7x between 2017 and 2025.","metrics":[{"v":"4.8x","l":"Online revenue 2017–25 (12→55 €m)"},{"v":"4.7x","l":"International revenue 2017–25 (8→35 €m)"},{"v":"7.5%","l":"AI chatbot conversion"},{"v":"66%","l":"AI chat fully self-served"}],"initiatives":[{"n":"Digital growth engine","d":"Online-first model with CAC/LTV discipline and retention-led acquisition","p":"Joan Pina"},{"n":"True omnichannel","d":"Stores, web and app fully integrated — rare in European motorcycle retail","p":"Joan Pina"},{"n":"International scale-up","d":"Expansion into PT, IT, DE and FR at marginal cost; marketplaces","p":"Joan Pina · Yvonne Bayer"},{"n":"AI retail engine","d":"Smart pricing, recommendations, search and AI-enabled workflows","p":"Aquiles · Carolina de la Calzada"}]},{"id":"nuzoa","excel":"Nuzoa","name":"Nuzoa","sector":"Animal Health · Distribution","onePager":true,"tagline":"From product distributor to digital animal health platform","desc":"Leading animal health distribution group in Spain, building a digital platform connecting farms, veterinarians, distributors and pharma.","arc":{"from":"2020 · Traditional distributor, limited digital capability","to":"2025 · Connected platform: backbone + online B2B + e-prescription"},"narrative":"Nuzoa starts with operational due diligence (Toni Franco) and a digital opportunity assessment (Daniel García Miranda) in 2021. The buy-and-build thesis requires a digital backbone: Joan Pina leads ERP integration and customer APIs, while Enric Peradejordi expands logistics capacity. On top of that backbone the online B2B channel is built (strategy by Iñaky Berzal, marketplaces with Yvonne Bayer), lifting online revenue by 20% and average basket by 10%. The differentiating asset is e-prescription: Genera Recetas ('unique data', Sergi Gomez + Joan Pina) processes 3M+ prescriptions a year with c.70% share of the digital market. The SaaS layer (Nuzogan and Ebersy, implemented by Acisclo Jr) adds compliance, a CO₂ module and analytics for farms — c.1M€ of incremental EBITDA.","metrics":[{"v":"+3M","l":"Digital prescriptions per year"},{"v":"c.70%","l":"Share of the digital prescription market"},{"v":"+20%","l":"Online B2B revenue growth"},{"v":"c.1M€","l":"Incremental EBITDA"}],"initiatives":[{"n":"Digital operating backbone","d":"ERP, WMS, CRM and logistics as the foundation of the buy-and-build","p":"Joan Pina · Enric Peradejordi"},{"n":"Online B2B platform","d":"Digital channel lifting online revenue and average basket","p":"Iñaky Berzal · Yvonne Bayer"},{"n":"E-prescription","d":"300k+ prescriptions/month, ~70% market coverage","p":"Sergi Gomez · Joan Pina"},{"n":"SaaS, analytics & regulatory","d":"Nuzogan and Ebersy: compliance, CO₂, ordering and analytics","p":"Joan Pina · Acisclo Jr"}]},{"id":"kbv","excel":"Kbv","name":"Kitchen Bath Ventures","sector":"Consumer · Kitchen furniture","onePager":true,"tagline":"Turning independent kitchen dealers into a digital sales network","desc":"One of Spain's leading kitchen manufacturing groups, selling through a network of small independent local dealers.","arc":{"from":"2022 · Fragmented dealers, paper-based processes","to":"2025 · Digital network: leads + CRM + quoting tool + analytics"},"narrative":"At KBV the challenge was not digitalising a single company but a network of hundreds of independent dealers. Following the 2021 ERP assessment (Rebecca Tresserres) and operating model work (Francesc Corella), Maria Parareda has led since 2022 the build-out of the OneStop platform described in the one-pager: the Quoting Tool (real-time quotations against live catalogue and pricing), Locator, Lead Generator (centralised marketing distributing qualified leads to dealers) and a SaaS CRM that replaces paper with structured pipeline management, with bespoke development by Evotic. The outcome: 90% of customers on the platform, 200+ monthly active users, +2M€ in monthly quotations and +10% of orders fully digital. In parallel, sustainability enters through the board (Montse Maresch) and industrial efficiency with Enric Peradejordi.","metrics":[{"v":"+90 p.p.","l":"Customers using OneStop (0→90%)"},{"v":"200+","l":"Monthly active users"},{"v":"+2M€","l":"Monthly quotations via the platform"},{"v":"+10%","l":"Monthly orders fully digital"}],"initiatives":[{"n":"Digital Lead Gen","d":"Centralised marketing delivering qualified leads to local dealers","p":"Maria Parareda"},{"n":"SaaS CRM for dealers","d":"From paper to structured pipeline for an efficient commercial model","p":"Maria Parareda"},{"n":"Digital quoting tool","d":"Real-time quotations integrated with live catalogue and pricing","p":"Maria Parareda · Evotic"},{"n":"Conversion Analytics","d":"Performance by dealer and automated support for laggards","p":"Maria Parareda"}]},{"id":"pronokal","excel":"Pronokal","name":"PronoKal","sector":"Healthcare · Medical Nutrition","onePager":true,"tagline":"From analogue prescription to a fully digital patient journey","desc":"Leading medical weight loss and nutrition company, with physician-prescribed programmes and personalised patient follow-up.","arc":{"from":"2017 · Sales through prescribers, low visibility","to":"2022 · Connected platform: app + devices + prescriber platform"},"narrative":"PronoKal starts at board level (healthcare advisory with Josep Maria Payà and strategy advisory with Félix Rivera, 2017) and with the foundations: big data & analytics (Josep Maria Mingot), add-on integration (Andreu Puig) and a new logistics centre (Enric Peradejordi). Following the 2018 Digital Day, Maria Parareda leads in 2019 the build-out of the full digital journey set out in the one-pager: PronoKal Connect (the patient app: plan, progress, weight — 22k customers, with a connected smart scale), MyPatients / Doctor Digital Platform (the prescriber platform: 73% of physicians active and 86% of prescriptions digital), the new eCommerce and the BI layer built on Power BI that feeds personalisation, retention and adherence. Telemedicine reaches 49% adoption in 2022.","metrics":[{"v":"22k","l":"Customers on PronoKal Connect"},{"v":"86%","l":"Prescriptions via MyPatients"},{"v":"73%","l":"Prescribers using MyPatients"},{"v":"49%","l":"Telemedicine adoption"}],"initiatives":[{"n":"PronoKal Connect","d":"Patient app: plan adherence, progress and weight tracking","p":"Maria Parareda"},{"n":"MyPatients","d":"Prescriber platform: patient management and digital prescriptions","p":"Maria Parareda"},{"n":"Smart Scale","d":"Connected monitoring and adherence visibility","p":"Maria Parareda"},{"n":"BI, AI & ML","d":"Data-driven personalisation, retention and adherence","p":"Josep Maria Mingot · Maria Parareda"}]},{"id":"isolana","excel":"Isolana","name":"Isolana","sector":"Distribution · Building Materials","onePager":true,"tagline":"From analogue execution to a digital service platform","desc":"Distributor of construction and insulation materials, digitalising a traditionally analogue and fragmented sector.","arc":{"from":"2019 · Analogue, people-dependent execution","to":"2021 · Digital service platform: CRM + click & collect + WMS"},"narrative":"Isolana demonstrates the applicability of the Fast Forward playbook in traditional distribution sectors. 2019 lays the foundations: finance capabilities (Carlos de la Fuente) and an ERP diagnostic (Rebecca Tresserres). In 2020 Joan Pina rolls out in parallel the three building blocks of the one-pager: ForceManager CRM for the field sales force (from 0% to 80% of commercial activity digitally tracked, +10% estimated productivity), Isolana Order (click & collect via WhatsApp, phone or customer service, cutting customer waiting time by 25%) and the WMS for stock visibility and working capital (+15% warehouse productivity). Digital recruitment (Joan Pina) and the sustainability agenda (Montse Maresch) complete the picture. Two years to move from people-dependent execution to a digital, scalable operating model.","metrics":[{"v":"+80 p.p.","l":"Commercial activity digitally tracked"},{"v":"+10%","l":"Estimated commercial productivity"},{"v":"-25%","l":"Customer waiting time"},{"v":"+15%","l":"Estimated warehouse productivity"}],"initiatives":[{"n":"ForceManager CRM","d":"Field sales activity, prospecting and follow-up","p":"Joan Pina"},{"n":"Isolana Order","d":"Click & collect via WhatsApp, phone or customer service","p":"Joan Pina"},{"n":"WMS","d":"Stock visibility, fulfilment and working capital control","p":"Joan Pina"},{"n":"Digital operating model","d":"Scalable execution discipline across the value chain","p":"Joan Pina"}]},{"id":"agroponiente","excel":"Agroponiente","name":"Agroponiente","sector":"Agribusiness","onePager":true,"tagline":"Agroponiente 4.0: an AI-powered agricultural operating system","desc":"Spanish leader in the production, handling and marketing of fresh fruit and vegetables.","arc":{"from":"2019 · Reactive and manual crop management","to":"Today · Agritech operations: field data + predictive AI + dashboards"},"narrative":"Agroponiente illustrates the layered model: Capture → Integrate → Predict → Decide. Entry (2019) secures the fundamentals: ERP assessment (Rebecca Tresserres), reporting and budgeting (Carlos de la Fuente) and cost optimisation (Enric Peradejordi). In 2020 come the commercial model and the Business Intelligence layer (Monica Perez) that unifies the data. On that base the system described in the one-pager is built: Hawk Eye (a real-time control centre with crop IoT, productivity alerts and KPIs), Savian Human (structured capture of agronomic data by field operators — 1.5M data points per day) and predictive AI models for irrigation, fertilisation, crop health and yield, alongside automated claims management from the ERP. Infrastructure is reinforced with the data centre (David Garriga) and the ESG agenda with Anna Ribalta (Sustainability Day, taxonomy session).","metrics":[{"v":"1.5M","l":"Field data points per day"},{"v":"Real-time","l":"Crop status, alerts and KPIs"},{"v":"Predictive","l":"Lower resource consumption (irrigation, fertilisation)"},{"v":"Auto","l":"Improved accuracy in claims estimation"}],"initiatives":[{"n":"Hawk Eye","d":"Real-time control centre: crop IoT, alerts and KPIs in a single view","p":"Monica Perez · FF team"},{"n":"Savian Human","d":"Structured agronomic data capture by field operators","p":"FF team"},{"n":"Predictive AI","d":"Optimisation of irrigation, fertilisation, crop health and yield","p":"FF team"},{"n":"AI claims","d":"Automated financial risk estimation from ERP and volume data","p":"FF team"}]},{"id":"btsa","excel":"Btsa","name":"BTSA","sector":"Natural Ingredients · B2B","onePager":true,"tagline":"Turning commercial expansion into a data-driven, AI-powered growth engine","desc":"Global specialist in natural antioxidants, vitamin E and functional ingredients for international B2B markets.","arc":{"from":"2022 · Fragmented intelligence, manual sales","to":"2025 · AI engine: xNova + Salesforce + Imperia + AI content"},"narrative":"BTSA starts as always: pre-deal market analysis (Javier Solans, 2022), which continues as board advisory. In 2023 the foundations are activated — ERP diagnostic (Rebecca Tresserres) and finance capabilities (Marcos Gómez) — and on top of them the commercial engine set out in the one-pager: xNova, the AI trade intelligence tool that has analysed +2,250 importers and mapped $770M of APAC volume, segmenting 365 and passing 300 to the sales team; Salesforce CRM for funnel visibility (conversion +13 p.p., from 2% to 15%); Imperia for NPI, planning and working capital (NWC cycle from 93 to 44 days, 2x shorter); and the AI technical content engine for demand generation. The pipeline remains active: commercial model and CRM (Josep Maria Piera) and deal gen (Iñaky Berzal) under evaluation.","metrics":[{"v":"+2,250","l":"Importers analysed with xNova"},{"v":"+13 p.p.","l":"Funnel conversion (2% → 15%)"},{"v":"2x","l":"Working capital cycle (93 → 44 days)"},{"v":"$770M","l":"APAC volume mapped"}],"initiatives":[{"n":"xNova","d":"AI trade intelligence: importers, distributors and competitors by geography","p":"FF team"},{"n":"Salesforce CRM","d":"Funnel, conversion, pipeline and commercial performance","p":"Josep Maria Piera (proposal)"},{"n":"Imperia","d":"NPI, operations planning and working capital control","p":"FF team"},{"n":"AI content engine","d":"Technical content at scale for demand and positioning","p":"FF team"}]},{"id":"recalvi","excel":"Recalvi","name":"Recalvi","sector":"Automotive · Aftermarket","onePager":true,"tagline":"An AI intelligence layer to create value from day one","desc":"Automotive spare parts distribution platform competing in a fragmented, fast-moving aftermarket.","arc":{"from":"2025 · Fragmented, limited management visibility","to":"2026 · Intelligence layer: reporting + insights + automation + M&A"},"narrative":"Recalvi showcases the most recent Fast Forward playbook: creating value with AI from before closing. Due diligence (operational with Guillermo Oliva, technology with Rebeca Tresserres, sector knowledge from Josep Granyó) maps integration risks ahead of Day 1. Since 2025, the AI for Documents project (Juan Huguet) has evolved into the intelligence layer described in the one-pager: board-ready weekly reporting on sales, margin, customers, territories and brands (from monthly reporting to full weekly visibility, +100 p.p. of PoS covered); a commercial insight layer that detects trends, margin deviations and customer-level opportunities; order automation PoCs that convert WhatsApp messages into structured orders (+20 p.p. of PoS); and an M&A intelligence playbook first deployed in the Zoel deal.","metrics":[{"v":"+100 p.p.","l":"PoS with monthly reporting and forecast"},{"v":"Weekly","l":"Deviations by customer, territory and brand"},{"v":"+20 p.p.","l":"PoS using AI order automation"},{"v":"Zoel","l":"Integration risks mapped pre-Day 1"}],"initiatives":[{"n":"AI reporting","d":"Board-ready weekly insights: sales, margin, customers, territories, brands","p":"Juan Huguet"},{"n":"Commercial insight layer","d":"Sales trends, margin deviations and opportunities","p":"Juan Huguet"},{"n":"AI order automation","d":"PoCs: from WhatsApp to structured purchase orders","p":"Juan Huguet"},{"n":"M&A intelligence playbook","d":"Faster target assessment and integration (Zoel deal)","p":"FF team"}]},{"id":"grupodeincendios","excel":"Grupo De Incendios","name":"Grupo de Incendios","sector":"Industrials · Fire Protection","onePager":true,"tagline":"From fragmented legacy systems to an AI-ready digital backbone for growth","desc":"Leading designer, manufacturer and distributor of active fire protection systems.","arc":{"from":"2025 · Fragmented legacy systems, manual work","to":"2026 · Single digital core: Navision + AI automation + Cockpit"},"narrative":"Like Recalvi, Grupo de Incendios is built on the AI-first playbook from the outset: operational due diligence (Alberto Matamoros) and technology due diligence (Rebeca Tresserres) define a five-phase digital roadmap ahead of closing. The one-pager captures the execution: Navision as the single backbone (finance, procurement, sales, warehouse, production), WMS and S&OP for stock visibility and working capital discipline, AI workflow automation (quotations, reports, documents, emails and shop-floor orders — quotation lead time falls from 7 to 2 days, 3x faster) and the CEO Cockpit, a weekly AI briefing on KPIs, deviations and recommended actions. Monthly financial reporting moves from 30 to 5 days (6x). All delivered through two-week AI sprint cycles and an M&A-ready backbone to integrate future acquisitions.","metrics":[{"v":"3x","l":"Faster quotation issuance (7→2 days)"},{"v":"6x","l":"Monthly financial reporting (30→5 days)"},{"v":"2 wks","l":"AI automation sprint cycle"},{"v":"M&A-ready","l":"Scalable backbone for integrations"}],"initiatives":[{"n":"Navision backbone","d":"Single ERP: finance, procurement, sales, warehouse, production","p":"FF team"},{"n":"CEO Cockpit","d":"Weekly AI briefing: KPIs, deviations and recommended actions","p":"FF team"},{"n":"WMS/SGA + S&OP","d":"Stock visibility, fulfilment and working capital","p":"FF team"},{"n":"AI workflow automation","d":"Quotations, reports, documents, emails and shop-floor orders","p":"FF team"}]},{"id":"avanzafood","excel":"Avanza Food","name":"Avanza Food","sector":"Consumer Services · Foodservice","onePager":false,"tagline":"End-to-end digital transformation of an organised restaurant group","desc":"Multi-brand organised restaurant group with owned and franchised networks.","arc":{"from":"2018 · Pre-digital multi-brand group","to":"2023 · Digital platform: delivery, CRM, academy and franchise lead gen"},"narrative":"Avanza Food (21 projects) follows the full playbook: it starts in 2018 with the Digital Day (Javier Garabal) and team build-up — digital assessment (Lidia García) and digital team recruitment (Mónica Comalrena), both later represented on the digital board. In 2019 the rails are laid (ERP diagnostic by Rebecca Tresserres, IT function and online purchasing platform for associated restaurants with Monica Perez, digital marketing). 2020 marks the step change: delivery transformation (Javier Garabal), BI and finance capabilities (Carlos de la Fuente). From 2021, the scale laye const toks=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(t=>t.length>1);
function lev1(a,b){if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(a.length-i)+(b.length-j)<=1}
const tokMatch=(t,u)=>t===u||(t.length>2&&u.startsWith(t))||(u.length>2&&t.startsWith(u))||(t.length>3&&u.length>3&&lev1(t,u));
function nameMatch(n1,n2){const A=toks(n1),B=toks(n2);if(!A.length||!B.length)return false;const [S,L]=A.length<=B.length?[A,B]:[B,A];const used=new Set();let miss=null;
 for(const t of S){let f=-1;for(let i=0;i<L.length;i++){if(!used.has(i)&&tokMatch(t,L[i])){f=i;break}}if(f>=0)used.add(f);else{if(miss)return false;miss=t}}
 if(!miss)return true;if(S.length<2)return false;
 return L.some((u,i)=>!used.has(i)&&u.slice(0,3)===miss.slice(0,3))}

function omniSearch(q){
 const drop=$('omniDrop');
 if(!q||q.trim().length<2){drop.classList.remove('show');drop.innerHTML='';return}
 const nq=norm(q);
 const test=s=>norm(s).indexOf(nq)>=0;
 const ps=DATA.partners.filter(p=>test(p.name)||test(p.org||'')||test((p.capabilities||[]).join(' '))).slice(0,4);
 const prs=DATA.projects.filter(x=>test(x.name)||test(x.partner)||test(x.investee)).slice(0,4);
 const cs=DATA.companies.filter(c=>test(c.name)||test(c.sector)||test(c.tagline)).slice(0,3);
 if(!ps.length&&!prs.length&&!cs.length){drop.innerHTML='<div class="omnigroup" style="padding-bottom:12px">No results</div>';drop.classList.add('show');return}
 drop.innerHTML=
  (ps.length?'<div class="omnigroup">Operating partners</div>'+ps.map(p=>`<button class="omnirow" onmousedown="event.preventDefault();omniGo(()=>openPartner('${p.key}'))">
    <div class="av" style="width:26px;height:26px;font-size:9.5px;border-radius:8px;background:#EEF2F6;color:#3C4A59">${esc(initials(p.name))}</div>
    <div><div class="t">${esc(p.name)}</div><div class="st">${esc((p.role||[]).join(' · ')||p.tipo||'')} · ${p.nprj||0} projects</div></div></button>`).join(''):'')+
  (prs.length?'<div class="omnigroup">Projects</div>'+prs.map(x=>`<button class="omnirow" onmousedown="event.preventDefault();omniGo(()=>openProject('${x.id}'))">
    <div class="av" style="width:26px;height:26px;font-size:9.5px;border-radius:8px;background:${AREA[x.area].color}">${esc(AREA[x.area].short[0])}</div>
    <div><div class="t">${esc(x.name)}</div><div class="st">${esc(coName(x.investee))}${x.partner?' · '+esc(x.partner):''}</div></div></button>`).join(''):'')+
  (cs.length?'<div class="omnigroup">Portfolio</div>'+cs.map(c=>`<button class="omnirow" onmousedown="event.preventDefault();omniGo(()=>openCompany('${c.id}'))">
    <div class="av" style="width:26px;height:26px;font-size:9.5px;border-radius:99px;background:#EEF2F6;color:#3C4A59">${esc(initials(c.name))}</div>
    <div><div class="t">${esc(c.name)}</div><div class="st">${esc(c.sector)}</div></div></button>`).join(''):'');
 drop.classList.add('show');
}

function omniCollapse(){const w=$('omniWrap');if(!w)return;const i=$('omniQ');const d=$('omniDrop');if(d)d.classList.remove('show');

const KPICOL=['#3FBECE','#6FA8D0','#7FC5D2','#D2B48C'];
function wband(items,cls){return `<div class="kgrid ${cls||''}">${items.map((i,ix)=>`
 <div class="kbox" style="--kc:${i.c||KPICOL[ix%4]}" ${i.go?`onclick="${i.go}"`:''}><div class="kn">${i.v}</div><div class="kl">${esc(i.l)}</div>${i.s?`<div class="ks">${esc(i.s)}</div>`:''}</div>`).join('')}</div>`}
let ddN=0;const DDREG={};
function fsel(state,key,label,opts,onchange){
 const cur=state[key]||'';
 const id='dd'+(++ddN);
 const items=opts.map(x=>typeof x==='string'?{v:x,t:x}:x);
 const sel=items.find(x=>x.v===cur);
 DDREG[id]={items:items,cur:cur,fn:onchange,label:label};
 return `<button class="ddt ${cur?'act':''}" id="${id}" onclick="ddToggle(event,'${id}')" onkeydown="ddKey(event,'${id}')" aria-haspopup="listbox" aria-expanded="false">
   <span class="ddl">${esc(label)}</span><span class="ddv">${esc(sel?sel.t:'All')}</span>
   <svg class="ddc" viewBox="0 0 10 10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M1.5 3.5L5 7l3.5-3.5"/></svg>
  </button>`}
function ddPortal(){let p=$('ddPortal');
 if(!p){p=document.createElement('div');p.id='ddPortal';p.className='ddp';document.body.appendChild(p)}
 return p}
let DDOPEN=null;
function ddCloseAll(){
 const p=$('ddPortal');if(p)p.classList.remove('show');
 if(DDOPEN){const t=$(DDOPEN);if(t){t.classList.remove('open');t.setAttribute('aria-expanded','false')}}
 DDOPEN=null}
function ddToggle(e,id){
 if(e)e.stopPropagation();
 if(DDOPEN===id){ddCloseAll();return}
 ddCloseAll();
 const t=$(id),cfg=DDREG[id];if(!t||!cfg)return;
 const p=ddPortal();
 const tick='<svg class="tick" viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 6.5l2.8 2.8L10 3.5"/></svg>';
 p.innerHTML=`<div class="ddhead">${esc(cfg.label)}</div>
  <button class="ddi ${!cfg.cur?'sel':''}" role="option" onclick="ddPick('${cfg.fn}','')">${tick}All</button>
  <div class="ddsep"></div>
  ${cfg.items.map(x=>`<button class="ddi ${x.v===cfg.cur?'sel':''}" role="option" onclick="ddPick('${cfg.fn}',${JSON.stringify(x.v).replace(/"/g,'&quot;')})">${tick}${esc(x.t)}</button>`).join('')}`;
 p.classList.add('show');
 const r=t.getBoundingClientRect();
 const pw=Math.max(r.width,Math.min(300,p.offsetWidth||220));
 p.style.minWidth=r.width+'px';
 let left=r.left, top=r.bottom+6;
 if(left+pw>window.innerWidth-14)left=Math.max(14,window.innerWidth-14-pw);
 const ph=p.offsetHeight;
 if(top+ph>window.innerHeight-14)top=Math.max(14,r.top-ph-6);
 p.style.left=left+'px';p.style.top=top+'px';
 t.classList.add('open');t.setAttribute('aria-expanded','true');
 DDOPEN=id;
 const first=p.querySelector('.ddi.sel')||p.querySelector('.ddi');
 if(first)setTimeout(()=>first.focus({preventScroll:true}),20)}
function ddPick(fn,val){ddCloseAll();const f=window[fn];if(typeof f==='function')f(val)}
function ddKey(e,id){
 if(e.key==='Escape'){ddCloseAll();const t=$(id);if(t)t.focus();return}
 if(e.key==='ArrowDown'||e.key==='ArrowUp'){
  e.preventDefault();
  if(DDOPEN!==id){ddToggle(e,id);return}
  const its=[...ddPortal().querySelectorAll('.ddi')];
  const i=its.indexOf(document.activeElement);
  const nx=e.key==='ArrowDown'?Math.min(its.length-1,i+1):Math.max(0,i-1);
  if(its[nx<0?0:nx])its[nx<0?0:nx].focus({preventScroll:true})}}
document.addEventListener('click',e=>{if(!e.target.closest('.ddt')&&!e.target.closest('#ddPortal'))ddCloseAll()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')ddCloseAll()});
window.addEventListener('resize',ddCloseAll);
window.addEventListener('scroll',()=>{if(DDOPEN)ddCloseAll()},true);
function fchips(items,clearFn){
 if(!items.length)return '';
 return `<div class="fchips">${items.map(it=>`<button class="fchip" onclick="${it.fn}"><span class="k">${esc(it.k)}</span> ${esc(it.v)} <i>&times;</i></button>`).join('')}
  <button class="fclear" onclick="${clearFn}">Clear all</button></div>`}

  ${fsel(opsF,'rol','Role',['Operating Partner','Senior Advisor'],'opsSet_rol')}
  ${fsel(opsF,'collab','Engagement',[{v:'Hands On',t:'Hands-on'},{v:'Hands Off',t:'Advisory'},{v:'Interim',t:'Interim'},{v:'Board',t:'Board'},{v:'Full time',t:'Full-time'}],'opsSet_collab')}
  ${fsel(opsF,'co','Company',DATA.companies.map(c=>({v:c.excel,t:c.name})),'opsSet_co')}

 <div id="opsMore"></div>`;
 opsChips();drawOps();if(ASK.dest==='ops'&&ASK.out)pickCount();
}

['area','estado','rol','collab','co','tipo','sort'].forEach(k=>{window['opsSet_'+k]=v=>{opsF[k]=v;opsAll=false;renderOps()}});
window.opsToggleAll=()=>{opsAll=!opsAll;drawOps();if(!opsAll)window.scrollTo({top:0,behavior:'smooth'})};
function opsChips(){
 const L={area:'Area',estado:'Status',rol:'Role',collab:'Engagement',co:'Company'};
 const items=[];
 Object.keys(L).forEach(k=>{if(!opsF[k])return;
  let v=opsF[k];
  if(k==='area')v=AREA[opsF[k]]?AREA[opsF[k]].short:v;
  if(k==='co')v=coName(opsF[k]);
  if(k==='collab')v={'Hands On':'Hands-on','Hands Off':'Advisory','Full time':'Full-time'}[v]||v;
  items.push({k:L[k],v:v,fn:"opsSet_"+k+"('')"})});
 if(opsF.q)items.push({k:'Search',v:opsF.q,fn:"opsF.q='';renderOps()"});
 $('opsChips').innerHTML=fchips(items,"Object.assign(opsF,{q:'',area:'',estado:'',rol:'',collab:'',co:'',tipo:''});renderOps()");
}
function opsMatch(p){
 if(opsF.area&&!(p.areas||[]).includes(opsF.area))return false;
 if(opsF.estado&&p.estado!==opsF.estado)return false;
 if(opsF.rol&&!(p.role||[]).includes(opsF.rol))return false;
 if(opsF.collab&&!(p.collab||[]).some(c=>c.indexOf(opsF.collab)>=0))return false;
 if(opsF.co&&!(p.cos||[]).includes(opsF.co)&&!(p.participadas||[]).some(x=>norm(x)===norm(opsF.co)))return false;
 if(opsF.tipo&&(p.tipo||'').toLowerCase().indexOf(opsF.tipo.toLowerCase())<0)return false;
 if(opsF.q){const hay=norm([p.name,p.org,p.cargo,p.ubicacion,p.bio,(p.capabilities||[]).join(' '),(p.tags||[]).join(' '),(p.sectores||[]).join(' '),(p.participadas||[]).join(' '),(p.cos||[]).map(coName).join(' '),(p.expertiseLegacy||[]).join(' '),(p.casos||[]).join(' ')].join(' '));
  if(!norm(opsF.q).split(/\s+/).filter(Boolean).every(w=>hay.indexOf(w)>=0))return false}
 return true}
function drawOps(){
 let list=DATA.partners.filter(opsMatch);
 const ord={'prj':(a,b)=>b.nprj-a.nprj||a.name.localeCompare(b.name),
  'az':(a,b)=>a.name.localeCompare(b.name),
  'recent':(a,b)=>(b.until||'0').localeCompare(a.until||'0')||b.nprj-a.nprj,
  'estado':(a,b)=>(a.estado||'').localeCompare(b.estado||'')||b.nprj-a.nprj};
 list.sort(ord[opsF.sort]||ord.prj);
 $('opsCount').textContent=list.length+' operating partners';
 const shown=opsAll?list:list.slice(0,OPS_STEP);
 const ST={'Active LTM':['#E8F4EE','#1F7A4D','Active'],

function prjChips(){
 const L={area:'Area',co:'Company',partner:'Partner',status:'Status',year:'Year',goal:'Objective',inv:'Involvement'};

 Object.keys(L).forEach(k=>{if(!prjF[k])return;
  let v=prjF[k];
  if(k==='area')v=AREA[prjF[k]]?AREA[prjF[k]].short:v;
  if(k==='co')v=coName(prjF[k]);
  if(k==='partner')v=(partnersByKey[prjF[k]]||{}).name||v;
  items.push({k:L[k],v:v,fn:"prjSet_"+k+"('')"})});
 if(prjF.group)items.push({k:'Agrupado por',v:{co:'Company',area:'Area',year:'Year',partner:'Partner'}[prjF.group],fn:"prjSet_group('')"});
 if(prjF.q==='▸impact')items.push({k:'Filtro',v:'Con impacto medido',fn:"prjF.q='';renderPrj(Object.assign({},prjF))"});
 else if(prjF.q)items.push({k:'Search',v:prjF.q,fn:"prjF.q='';renderPrj(Object.assign({},prjF))"});
 const el=$('prjChips'); if(el)el.innerHTML=fchips(items,"renderPrj({})");

function prjList(){
 return DATA.projects.filter(p=>{
  if(prjF.area&&p.area!==prjF.area)return false;
  if(prjF.co&&p.investee!==prjF.co)return false;
  if(prjF.status&&p.status!==prjF.status)return false;
  if(prjF.partner&&p.partnerKey!==prjF.partner)return false;
  if(prjF.year&&(!p.fecha||p.fecha.slice(0,4)!==prjF.year))return false;
  if(prjF.goal&&p.goal!==prjF.goal)return false;
  if(prjF.inv&&p.involvement!==prjF.inv)return false;
  if(prjF.q==='▸impact')return p.impact&&!p.impactEst;
  if(prjF.q){const hay=norm([p.name,p.partner,p.investee,coName(p.investee),p.goal,p.desc,p.impact,AREA[p.area].name].join(' '));
   if(!qwords(prjF.q).every(w=>hay.indexOf(w)>=0))return false}
  return true}).sort((a,b)=>{
   if(prjF.sort==='az')return a.name.localeCompare(b.name);
   if(prjF.sort==='old')return (a.fecha||'9999').localeCompare(b.fecha||'9999');
   if(prjF.sort==='impact')return (b.impact&&!b.impactEst?1:0)-(a.impact&&!a.impactEst?1:0)||(b.fecha||'').localeCompare(a.fecha||'');
   return (b.fecha||'0000').localeCompare(a.fecha||'0000')});
}

 setTimeout(()=>{if(i){i.focus();i.setSelectionRange(i.value.length,i.value.length);askFit(i)}},40);
}
function askClose(){const o=$('askOv');if(o)o.classList.remove('on');document.body.style.overflow=''}

/* ---- ejecución y enrutado ---- */
function askRun(txt){
 const q=String(typeof txt==='string'?txt:($('askQ')?$('askQ').value:'')).trim();
 if(!q)return;
 const d=ASK.man||askRoute(q).d;
 ASK.q=q;ASK.dest=d;ASK.out='';ASK.sum='';ASK.crit='';
 askRemember(q);askClose();
 if(d==='ops'){
  Object.assign(opsF,{q:'',area:'',estado:'',rol:'',collab:'',co:'',tipo:''});opsAll=false;cmpSel=[];
  go('ops');runRec(q);return}
 if(d==='prj'){go('prj',askPrj(q));askSum('prj');return}
 const c=askCos(q);cosF.q=c.q;go('cos');
 if(c.open){openCompany(c.open);return}
 askSum('cos');
}
function askPrjCount(f,terms){
 return DATA.projects.filter(p=>{
  if(f.area&&p.area!==f.area)return false;
  if(f.co&&p.investee!==f.co)return false;
  if(f.partner&&p.partnerKey!==f.partner)return false;
  if(f.year&&(!p.fecha||p.fecha.slice(0,4)!==f.year))return false;
  if(!terms.length)return true;
  const hay=norm([p.name,p.partner,coName(p.investee),p.goal,p.desc,p.impact,AREA[p.area].name].join(' '));
  return terms.every(w=>hay.indexOf(w)>=0)}).length;
}
function askPrj(q){
 const f={area:'',co:'',partner:'',year:'',status:'',goal:'',inv:'',q:''};
 const nq=norm(q);
 const y=(q.match(/\b(20\d{2})\b/)||[])[1];if(y)f.year=y;
 const co=DATA.companies.find(c=>norm(c.name).length>3&&nq.indexOf(norm(c.name))>=0);if(co)f.co=co.excel;
 const pa=DATA.partners.find(p=>norm(p.name).length>7&&nq.indexOf(norm(p.name))>=0);if(pa)f.partner=pa.key;
 let terms=askTerms(q);
 if(co)terms=terms.filter(t=>norm(co.name).indexOf(t)<0);
 if(pa)terms=terms.filter(t=>norm(pa.name).indexOf(t)<0);
 if(/measur|medid|cuantific/i.test(q)&&!terms.length)f.q='\u25b8impact';
 else{
  const t2=terms.slice();
  while(t2.length&&!askPrjCount(f,t2))t2.pop();
  if(t2.length)f.q=t2.join(' ');
  else if(terms.length){const ar=askArea(terms);if(ar&&askPrjCount(Object.assign({},f,{area:ar}),[]))f.area=ar}
 }
 ASK.crit=[f.area?AREA[f.area].short:'',co?co.name:'',pa?pa.name:'',f.year,
  f.q==='\u25b8impact'?'measured impact':f.q?'\u201c'+f.q+'\u201d':''].filter(Boolean).join(' \u00b7 ')||'whole project history';
 return f;
}
function askCos(q){
 const nq=norm(q);
 const co=DATA.companies.find(c=>norm(c.name).length>3&&nq.indexOf(norm(c.name))>=0);
 if(co){ASK.crit=co.name;return {q:'',open:co.id}}
 const terms=askTerms(q);
 let pick='';
 for(const t of terms){if(DATA.companies.some(c=>norm(c.name+' '+c.sector+' '+(c.tagline||'')).indexOf(t)>=0)){pick=t;break}}
 ASK.crit=pick?'“'+pick+'”':'whole portfolio';
 return {q:pick,open:''};
}
async function askSum(v){
 const el=$('askSum');
 let items,head;
 if(v==='prj'){const all=prjList();ASK.n=all.length;
  items=all.slice(0,45).map(p=>({n:p.name,c:coName(p.investee),p:p.partner||'',a:AREA[p.area].short,y:p.fecha?p.fecha.slice(0,4):'',s:p.status,i:p.impact||''}));
  head='value creation projects delivered by Abac Fast Forward'}
 else{const all=DATA.companies.filter(c=>!cosF.q||norm(c.name+' '+c.sector+' '+(c.tagline||'')).indexOf(norm(cosF.q))>=0);ASK.n=all.length;
  items=all.map(c=>({n:c.name,s:c.sector,t:c.tagline||'',np:projsOfCompany(c.excel).length}));
  head='Abac portfolio companies'}
 if(!el)return;
 if(!hasCowork()&&!gemKey()){el.innerHTML='<span class="dim">'+ASK.n+' results. Add an AI key under “AI engine” for a written answer.</span>';ASK.sum='';return}
 el.innerHTML='<span class="spin"></span>Reading '+ASK.n+' records with '+engineName()+'…';
 try{
  const r=await askEngine('You are an analyst at Abac Capital, a Spanish mid-market private equity firm.\nQUESTION: "'+ASK.q+'"\nThese are the matching '+head+' in JSON:\n'+JSON.stringify(items)
   +'\nAnswer the question in 2-3 sentences of plain English, citing specific names, companies, partners or figures from the data. Be concrete, no generalities, no markdown, no preamble. If the data does not answer the question, say so plainly.\nReply with VALID JSON ONLY: {"a":"<answer>"}');
  let txt=typeof r==='string'?r:(r&&(r.text||(r.content&&r.content[0]&&r.content[0].text)))||'';
  const m=txt.match(/\{[\s\S]*\}/);const a=(m?JSON.parse(m[0]).a:txt)||'';
  ASK.sum=a;const e2=$('askSum');if(e2)e2.innerHTML=esc(a);
 }catch(err){
  ASK.sum='';const e2=$('askSum');
  if(e2)e2.innerHTML='<span class="dim">'+ASK.n+' results shown below · AI summary unavailable ('+esc((err&&err.message)||'error')+').</span>';
 }
}
function askBanner(v){
 if(!ASK.q||ASK.dest!==v)return '';
 const meta=v==='ops'?'AI shortlist from the operating partner network'
  :(v==='prj'?'Projects filtered':'Portfolio filtered')+(ASK.crit?' · '+esc(ASK.crit):'');
 return '<div class="askban"><span class="abi">'+SPARK+'</span><div class="abt">'
  +'<div class="abq">'+esc(ASK.q)+'</div><div class="abm">'+meta+'</div>'
  +(v!=='ops'?'<div class="absum" id="askSum">'+(ASK.sum?esc(ASK.sum):'')+'</div>':'')
  +'</div><div class="aba"><button class="abbtn" onclick="askOpen(ASK.q)">Refine</button>'
  +'<button class="abx" onclick="askClear()" title="Clear search">×</button></div></div>';
}
function askClear(){
 const v=ASK.dest;ASK.q='';ASK.dest='';ASK.out='';ASK.sum='';ASK.crit='';ASK.man='';
 if(v==='ops')renderOps();
 else if(v==='prj')renderPrj({});
 else if(v==='cos'){cosF.q='';renderCos()}
}
document.addEventListener('keydown',e=>{
 if((e.metaKey||e.ctrlKey)&&(e.key==='k'||e.key==='K')){e.preventDefault();
  const o=$('askOv');(o&&o.classList.contains('on'))?askClose():askOpen();return}
 if(e.key==='Escape'){const o=$('askOv');if(o&&o.classList.contains('on')){askClose();return}
  const w=$('omniWrap');if(w&&w.classList.contains('open')){const i=$('omniQ');if(i)i.value='';omniCollapse()}}
});

gateInit();
