<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Abac Fast Forward · Hub</title>
<style>
  :root{color-scheme:light;
    --navy:#0B2440;--navy2:#123153;--navy3:#1A4066;--blue:#2E6DA8;--blue2:#4A87C0;--cyan:#149DAF;--cyan2:#3FBECE;
    --gold:#C9A96A;
    --ink:#16202C;--body:#3C4956;--muted:#8792A0;--faint:#AEB7C2;
    --line:#E3E9F1;--line2:#EDF1F7;--page1:#F6F8FB;--page2:#EDF0F6;
    --display:'Segoe UI Semibold','Segoe UI',system-ui,-apple-system,sans-serif;
    --sans:'Segoe UI',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:ui-monospace,'Cascadia Code','SFMono-Regular',Consolas,monospace;
    --r:14px;--r2:18px;
    --sh:0 1px 2px rgba(11,36,64,.04),0 8px 24px rgba(11,36,64,.06);
    --sh2:0 2px 6px rgba(11,36,64,.06),0 20px 48px rgba(11,36,64,.13);
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-0.01em;font-size:14px;
    background:radial-gradient(1200px 500px at 50% -10%,rgba(46,109,168,.10),transparent 60%),linear-gradient(180deg,var(--page1),var(--page2));background-attachment:fixed;min-height:100vh}
  ::selection{background:rgba(20,157,175,.22)}

  /* ---------- HEADER ---------- */
  .hdr{position:sticky;top:0;z-index:40;background:linear-gradient(180deg,#0A2038 0%,#0E2A47 100%);padding:16px 28px 0;box-shadow:0 10px 34px rgba(7,22,40,.35)}
  .hdr::after{content:"";display:block;height:1px;margin:0 -28px;background:linear-gradient(90deg,transparent,rgba(201,169,106,.55) 20%,rgba(63,190,206,.5) 80%,transparent)}
  .hdr-inner{max-width:1320px;margin:0 auto}
  .brandrow{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
  .logo{font-family:var(--display);font-weight:700;font-size:27px;letter-spacing:-0.03em;color:#fff;line-height:1}
  .lockdiv{width:1px;height:32px;background:rgba(255,255,255,.22)}
  .prod{font-family:var(--display);font-weight:600;font-size:15px;color:#EAF1F8;line-height:1.1}
  .subt{font-family:var(--mono);font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:#7E9BBA;margin-top:3px}
  .sync{display:flex;align-items:center;gap:8px;font-size:10.5px;color:#93AAC3;font-family:var(--mono);letter-spacing:.02em}
  .sync .led{width:7px;height:7px;border-radius:99px;background:#F0B429;box-shadow:0 0 8px rgba(240,180,41,.8)}
  .sync.ok .led{background:#3DDC97;box-shadow:0 0 8px rgba(61,220,151,.8)}
  .sync.err .led{background:#E86B6B}
  /* omnibox */
  .omni{position:relative;margin-left:auto;display:flex;align-items:center;gap:14px}
  .omni input{width:300px;max-width:44vw;padding:9px 14px 9px 36px;border-radius:10px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;font-size:12.5px;font-family:var(--sans);outline:none;transition:background .15s,border-color .15s}
  .omni input::placeholder{color:#7E96B2}
  .omni input:focus{background:rgba(255,255,255,.13);border-color:rgba(63,190,206,.55)}
  .omni svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.55}
  .omnidrop{position:absolute;top:calc(100% + 8px);right:0;width:420px;max-width:82vw;max-height:60vh;overflow:auto;background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:var(--sh2);display:none;z-index:60}
  .omnidrop.show{display:block}
  .omnigroup{font-family:var(--mono);font-size:9px;letter-spacing:.16em;text-transform:uppercase;color:var(--faint);padding:11px 15px 5px}
  .omnirow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:8px 15px;cursor:pointer;font-family:var(--sans)}
  .omnirow:hover{background:#F3F6FA}
  .omnirow .t{font-size:13px;font-weight:600;color:var(--navy2)}
  .omnirow .st{font-size:11px;color:var(--muted)}
  .tabs{display:flex;gap:2px;flex-wrap:wrap;margin-top:15px}
  .tab{position:relative;padding:11px 17px 13px;font-size:13px;border:0;border-radius:10px 10px 0 0;background:transparent;color:#93AAC3;cursor:pointer;font-family:var(--display);font-weight:500;letter-spacing:.01em;transition:color .15s,background .15s}
  .tab:hover{color:#D8E4EF}
  .tab.on{background:linear-gradient(180deg,rgba(255,255,255,.09),rgba(255,255,255,0));color:#fff;font-weight:600}
  .tab.on::after{content:"";position:absolute;left:15px;right:15px;bottom:0;height:2.5px;border-radius:3px 3px 0 0;background:linear-gradient(90deg,var(--cyan2),var(--cyan))}

  .wrap{padding:28px 28px 40px;max-width:1320px;margin:0 auto}
  section{animation:fade .32s cubic-bezier(.2,.7,.3,1)}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  /* ---------- TIPOGRAFIA DE SECCION ---------- */
  .kick{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--cyan);margin-bottom:9px}
  .kick::before{content:"";display:inline-block;width:22px;height:1px;background:var(--gold);vertical-align:middle;margin-right:9px}
  h1.s{font-family:var(--display);font-size:26px;margin:0 0 4px;font-weight:700;letter-spacing:-0.022em;color:var(--navy)}
  p.lead{font-size:14px;line-height:1.65;color:var(--body);max-width:760px;margin:8px 0 22px}
  .seclab{font-family:var(--mono);font-size:9.5px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--faint);margin:20px 0 8px;display:flex;align-items:center;gap:8px}
  .seclab::after{content:"";flex:1;height:1px;background:var(--line2)}

  /* ---------- CONTROLES ---------- */
  .card{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:20px 22px;box-shadow:var(--sh)}
  textarea,input.tin,select.tin{width:100%;padding:10px 14px;border:1px solid #D6DEE9;border-radius:10px;font-family:var(--sans);font-size:13.5px;outline:none;resize:vertical;color:var(--ink);background:#fff;transition:border-color .15s,box-shadow .15s}
  select.tin{cursor:pointer;color:var(--body)}
  textarea:focus,input.tin:focus,select.tin:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(46,109,168,.12)}
  .btn{padding:10px 18px;border:0;border-radius:10px;background:linear-gradient(135deg,#173E66,#0B2440);color:#fff;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--display);letter-spacing:.01em;box-shadow:0 6px 16px rgba(11,36,64,.22);transition:transform .14s,filter .14s}
  .btn:hover{filter:brightness(1.12);transform:translateY(-1px)}
  .btn:disabled{opacity:.45;cursor:default;transform:none}
  .btn.ghost{background:#fff;color:var(--navy2);border:1px solid #CBD6E2;box-shadow:0 1px 4px rgba(11,36,64,.05)}
  .btn.ghost:hover{border-color:var(--blue);color:var(--blue);filter:none}
  .btn.mini{padding:6px 13px;font-size:12px;border-radius:9px}
  .row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
  .between{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
  .filtbtn{font-size:11.5px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;color:#5B6675;cursor:pointer;font-family:var(--sans);margin:0 5px 6px 0;font-weight:500;transition:all .13s;box-shadow:0 1px 2px rgba(11,36,64,.03)}
  .filtbtn:hover{border-color:#B9C9DA;color:var(--navy2)}
  .filtbtn.on{background:var(--navy);color:#fff;border-color:var(--navy);box-shadow:0 4px 12px rgba(11,36,64,.24)}
  .searchbox{position:relative;max-width:520px;flex:1;min-width:240px}
  .searchbox svg{position:absolute;left:14px;top:50%;transform:translateY(-50%);opacity:.4}
  .searchbox input{padding-left:40px}

  /* ---------- HERO / DASHBOARD ---------- */
  .hero{position:relative;overflow:hidden;border-radius:22px;padding:38px 42px 34px;color:#fff;
    background:linear-gradient(120deg,#0E2A47 0%,#0B2440 55%,#11365B 100%);box-shadow:0 26px 60px rgba(9,28,50,.35);margin-bottom:22px}
  .hero::before{content:"";position:absolute;inset:0;background:radial-gradient(640px 300px at 90% -14%,rgba(20,157,175,.28),transparent 60%),radial-gradient(480px 320px at 4% 130%,rgba(74,135,192,.30),transparent 62%);pointer-events:none}
  .hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px);background-size:36px 36px;opacity:.5;pointer-events:none;mask-image:radial-gradient(600px 320px at 80% 0%,#000,transparent 75%)}
  .hero>*{position:relative;z-index:1}
  .hero .kick{color:var(--cyan2)}
  .hero .kick::before{background:var(--gold)}
  .hero h1{font-family:var(--display);font-size:31px;line-height:1.12;margin:0 0 12px;font-weight:700;letter-spacing:-0.028em;color:#fff;max-width:780px}
  .hero p{font-size:14.5px;line-height:1.65;color:#B9CCDF;max-width:700px;margin:0}
  .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:18px 0 4px}
  @media(max-width:760px){.stats{grid-template-columns:repeat(2,1fr)}}
  .stat{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 17px 13px;box-shadow:var(--sh);cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}
  .stat:hover{transform:translateY(-2px);box-shadow:var(--sh2);border-color:#CFDBE8}
  .stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(180deg,var(--blue2),var(--cyan))}
  .stat .v{font-family:var(--display);font-size:26px;font-weight:700;letter-spacing:-0.02em;color:var(--navy)}
  .stat .l{font-size:12.5px;color:#35424F;margin-top:1px;font-weight:600}
  .stat .s{font-family:var(--mono);font-size:9px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:3px}
  .dashgrid{display:grid;grid-template-columns:1.5fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:900px){.dashgrid{grid-template-columns:1fr}}
  .dashgrid2{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:14px}
  @media(max-width:900px){.dashgrid2{grid-template-columns:1fr}}
  .chartcard{background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:18px 20px 14px;box-shadow:var(--sh)}
  .chartcard h3{margin:0 0 2px;font-family:var(--display);font-size:14px;font-weight:700;color:var(--navy)}
  .chartcard .sub{font-size:11.5px;color:var(--muted);margin-bottom:10px}
  .chartbox{position:relative;height:230px}
  .leader{display:flex;align-items:center;gap:11px;padding:8px 0;border-bottom:1px solid var(--line2);cursor:pointer}
  .leader:last-child{border-bottom:0}
  .leader:hover .t{color:var(--blue)}
  .leader .t{font-size:12.5px;font-weight:600;color:var(--navy2);width:150px;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .leader .n{font-family:var(--mono);font-size:11px;color:var(--muted);min-width:22px;text-align:right}
  .costrip{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .cochip{display:inline-flex;align-items:center;gap:8px;padding:7px 13px 7px 8px;border-radius:999px;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:var(--sans);font-size:12px;font-weight:600;color:var(--navy2);box-shadow:0 1px 3px rgba(11,36,64,.05);transition:all .14s}
  .cochip:hover{border-color:var(--cyan);transform:translateY(-1px);box-shadow:var(--sh)}
  .cochip .cav{width:22px;height:22px;border-radius:99px;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;font-family:var(--display)}
  .cochip .np{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:500}

  /* ---------- TARJETAS ---------- */
  .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:14px}
  .grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
  .op{position:relative;overflow:hidden;display:block;text-align:left;width:100%;background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:17px 18px;cursor:pointer;font-family:var(--sans);box-shadow:var(--sh);transition:box-shadow .18s,transform .18s,border-color .18s}
  .op::before{content:"";position:absolute;left:0;right:0;top:0;height:3px;background:var(--accgrad,linear-gradient(90deg,var(--blue2),var(--blue)));opacity:.85}
  .op:hover{box-shadow:var(--sh2);transform:translateY(-3px);border-color:#CFDBE8}
  .op.selcmp{outline:2px solid var(--cyan);outline-offset:-2px}
  .ophead{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .av{width:42px;height:42px;border-radius:12px;color:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;flex:0 0 auto;font-family:var(--display);box-shadow:0 5px 14px rgba(11,36,64,.22);letter-spacing:.02em}
  .opname{font-size:14.5px;font-weight:600;color:var(--navy);line-height:1.15;letter-spacing:-0.01em}
  .oprole{font-size:11.5px;color:var(--muted);margin-top:2px}
  .badge{margin-left:auto;font-size:10px;font-weight:600;padding:4px 10px;border-radius:999px;white-space:nowrap;letter-spacing:.02em}
  .pill{display:inline-block;font-size:10.5px;font-weight:600;padding:3px 9px;border-radius:7px;margin:0 5px 5px 0;background:rgba(46,109,168,.09);color:#255884;letter-spacing:.01em}
  .pill.tag{background:#F1F4F8;color:#5B6675;font-weight:500}
  .foot{display:flex;flex-wrap:wrap;gap:5px 14px;font-size:11.5px;color:var(--muted);align-items:center;border-top:1px solid var(--line2);padding-top:10px;margin-top:10px}

  /* ---------- PROYECTOS ---------- */
  .prj{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:15px 18px;box-shadow:var(--sh);transition:box-shadow .16s,transform .16s,border-color .16s;position:relative;overflow:hidden}
  .prj::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3.5px;background:var(--acc,#2E6DA8)}
  .prj:hover{box-shadow:var(--sh2);transform:translateY(-2px);border-color:#CFDBE8}
  .prjname{font-family:var(--display);font-weight:600;font-size:14px;color:var(--navy);letter-spacing:-0.01em;line-height:1.3}
  .prjmeta{font-size:11.5px;color:var(--muted);margin-top:4px;display:flex;gap:10px;flex-wrap:wrap}
  .link{color:var(--blue);cursor:pointer;text-decoration:none;font-weight:600}
  .link:hover{text-decoration:underline}
  .stpill{font-size:9.5px;font-weight:700;padding:3px 9px;border-radius:999px;text-transform:uppercase;letter-spacing:.05em;flex:0 0 auto}

  /* ---------- DRAWER ---------- */
  .drawer-bg{position:fixed;inset:0;background:rgba(9,26,46,.46);display:none;justify-content:flex-end;z-index:50;backdrop-filter:blur(4px)}
  .drawer-bg.show{display:flex;animation:fadebg .2s ease}
  @keyframes fadebg{from{opacity:0}to{opacity:1}}
  .drawer{background:#F7F9FC;width:100%;max-width:580px;height:100%;overflow:auto;animation:slidein .3s cubic-bezier(.2,.7,.3,1);box-shadow:-24px 0 60px rgba(9,26,46,.3)}
  @keyframes slidein{from{transform:translateX(48px);opacity:.5}to{transform:none;opacity:1}}
  .dband{position:relative;overflow:hidden;padding:22px 26px 20px;color:#fff;background:var(--accgrad,linear-gradient(135deg,#123153,#0B2440))}
  .dband::after{content:"";position:absolute;inset:0;background:radial-gradient(420px 200px at 92% -20%,rgba(255,255,255,.16),transparent 60%);pointer-events:none}
  .dband>*{position:relative;z-index:1}
  .dbody{padding:20px 26px 30px}
  .statstrip{display:flex;gap:20px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:13px 18px;margin:14px 0;box-shadow:var(--sh);flex-wrap:wrap}
  .statstrip .n{font-family:var(--display);font-size:18px;font-weight:700;color:var(--navy2);letter-spacing:-0.01em}
  .statstrip .k{font-family:var(--mono);font-size:8.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-top:2px}
  .lilink{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--blue);text-decoration:none;font-weight:600}
  .liico{width:18px;height:18px;border-radius:4px;background:#0A66C2;color:#fff;display:inline-flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:10px}
  .muted{color:var(--muted)}
  a{color:var(--blue)}

  /* ---------- PARTICIPADA DETALLE ---------- */
  .cohero{position:relative;overflow:hidden;border-radius:22px;padding:34px 38px 30px;color:#fff;background:linear-gradient(120deg,#123153,#0B2440);box-shadow:0 22px 54px rgba(9,28,50,.32);margin-bottom:20px}
  .cohero::before{content:"";position:absolute;inset:0;background:radial-gradient(520px 260px at 92% -12%,rgba(20,157,175,.30),transparent 60%);pointer-events:none}
  .cohero>*{position:relative;z-index:1}
  .arc{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:stretch;margin:20px 0 0}
  @media(max-width:760px){.arc{grid-template-columns:1fr}}
  .arcbox{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);border-radius:13px;padding:13px 17px;font-size:12.5px;line-height:1.55;color:#CBDAE8}
  .arcbox b{display:block;font-family:var(--mono);font-size:8.5px;letter-spacing:.16em;text-transform:uppercase;color:#7FC5D2;margin-bottom:5px}
  .arrow{font-size:20px;color:var(--cyan2);display:flex;align-items:center}
  .mgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin:16px 0}
  .metric{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
  .metric .v{font-family:var(--display);font-weight:700;font-size:21px;color:var(--navy2);letter-spacing:-0.02em}
  .metric .l{font-size:11.5px;color:var(--body);margin-top:3px;line-height:1.45}
  .narr{background:#fff;border:1px solid var(--line);border-left:3.5px solid var(--cyan);border-radius:var(--r);padding:18px 22px;font-size:13.5px;line-height:1.75;color:var(--body);box-shadow:var(--sh)}
  .init{display:flex;gap:13px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
  .init .ic{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue2),var(--cyan));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-family:var(--display);font-size:13px;flex:0 0 auto}
  .tl{position:relative;margin:8px 0 0;padding-left:24px}
  .tl::before{content:"";position:absolute;left:7px;top:6px;bottom:6px;width:2px;background:#DCE4EE;border-radius:2px}
  .tlrow{position:relative;padding:8px 0 8px 8px;border-radius:10px;transition:background .13s}
  .tlrow:hover{background:#F5F8FB}
  .tlrow::before{content:"";position:absolute;left:-21px;top:15px;width:9px;height:9px;border-radius:99px;background:var(--acc,#2E6DA8);border:2px solid #fff;box-shadow:0 0 0 2px #DCE4EE}
  .tlyear{font-family:var(--mono);font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--blue);margin:14px 0 2px;padding-left:8px}

  /* ---------- RECOMMENDER ---------- */
  .rec{position:relative;overflow:hidden;background:#fff;border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px;margin-bottom:12px;box-shadow:var(--sh)}
  .rec.top{border-color:#B4E0E7;box-shadow:0 2px 8px rgba(20,157,175,.13),0 16px 40px rgba(20,157,175,.11)}
  .rank{width:29px;height:29px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13.5px;color:#fff;background:linear-gradient(135deg,#5A6B7B,#3B4550);flex:0 0 auto}
  .rank.g{background:linear-gradient(135deg,var(--cyan2),var(--cyan));color:#06323A}
  .bar{flex:1;min-width:60px;height:7px;border-radius:999px;background:#EDF1F6;overflow:hidden}
  .bar>i{display:block;height:7px;border-radius:999px;background:linear-gradient(90deg,var(--blue2),var(--blue))}
  .fitn{font-family:var(--display);font-weight:700;color:var(--blue);font-size:14px;min-width:26px;text-align:right}
  .ex{display:block;width:100%;text-align:left;font-size:12.5px;padding:9px 13px;border:1px solid transparent;border-radius:10px;background:#F1F4F9;color:#4A5568;margin-bottom:6px;cursor:pointer;font-family:var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .13s,transform .1s}
  .ex:hover{background:#E8EFF6;transform:translateX(2px)}

v":"Daily","l":"POs precisas recomendadas a diario"},{"v":"+5k","l":"SKUs con visibilidad de pricing y tendencias"}],"initiatives":[{"n":"King Kong","d":"Big data para expansión de catálogo: una pieza → múltiples modelos de coche a escala","p":"Joan Pina"},{"n":"Infostocks","d":"Compras y demand planning automatizados con POs diarias inteligentes","p":"Joan Pina"},{"n":"Metalbrain","d":"Motor comercial: oportunidades perdidas y cuentas en declive","p":"Joan Pina"},{"n":"Changeover","d":"Inteligencia de pricing: posicionamiento en tiempo real vs distribuidores","p":"Joan Pina"}]},{"id":"motocard","excel":"Motocard","name":"Motocard","sector":"Consumer · Online Retail","onePager":true,"tagline":"De retailer a líder digital: la plataforma online #1 de moto del sur de Europa","desc":"Distribuidor omnicanal multimarca de equipamiento y accesorios para motoristas.","arc":{"from":"2017 · Tiendas físicas + web básica","to":"2025 · Líder digital con tecnología propietaria y capa operativa de IA"},"narrative":"Con 32 proyectos, Motocard es la participada con mayor intensidad Fast Forward. La historia empieza en el propio deal: assessment digital pre-deal de Elena Cusí y análisis de mercado de Josep Granyó (2018). La primera ola construye los cimientos (ERP assessment de Rebecca Tresserres, plan de marketing de Maria Parareda, board digital con Elena Cusí, Javi Osa y Pedro Esquivias). A partir de 2020 Joan Pina lidera el motor de crecimiento digital del one-pager: social sales por WhatsApp, estrategia get-local, comunidad Motochiara, la app de Motocard, Para Tu Moto y la expansión internacional (integración de Italia, marketplaces con Yvonne Bayer). La capa más reciente es IA: smart pricing (Aquiles, y ML con Carolina de la Calzada), modelo RFM para CRM y chatbot con 66% de conversaciones autoservidas. Resultado: online x4.8 y revenue internacional x4.7 entre 2017 y 2025.","metrics":[{"v":"4.8x","l":"Revenue online 2017–25 (12→55 €m)"},{"v":"4.7x","l":"Revenue internacional 2017–25 (8→35 €m)"},{"v":"7.5%","l":"Conversión del chatbot IA"},{"v":"66%","l":"Chat IA totalmente autoservido"}],"initiatives":[{"n":"Digital growth engine","d":"Modelo online-first con disciplina CAC/LTV y adquisición basada en retención","p":"Joan Pina"},{"n":"Omnicanalidad real","d":"Tiendas, web y app totalmente integradas — raro en retail moto europeo","p":"Joan Pina"},{"n":"Escalado internacional","d":"Expansión a PT, IT, DE y FR a coste marginal; marketplaces","p":"Joan Pina · Yvonne Bayer"},{"n":"AI retail engine","d":"Smart pricing, recomendaciones, búsqueda y workflows con IA","p":"Aquiles · Carolina de la Calzada"}]},{"id":"nuzoa","excel":"Nuzoa","name":"Nuzoa","sector":"Salud animal · Distribución","onePager":true,"tagline":"De distribuidor de producto a plataforma digital de salud animal","desc":"Grupo líder de distribución de salud animal en España, construyendo una plataforma digital entre granjas, veterinarios, distribuidores y pharma.","arc":{"from":"2020 · Distribuidor tradicional, digital limitado","to":"2025 · Plataforma conectada: backbone + B2B online + receta electrónica"},"narrative":"Nuzoa arranca con due diligence operacional (Toni Franco) y assessment de oportunidades digitales (Daniel García Miranda) en 2021. La tesis buy-and-build exige un backbone digital: Joan Pina lidera la integración de ERP y las APIs con clientes, mientras Enric Peradejordi amplía capacidad logística. Sobre ese backbone se construye el canal B2B online (estrategia de Iñaky Berzal, marketplaces con Yvonne Bayer) que eleva el revenue online +20% y la cesta media +10%. La pieza diferencial es la receta electrónica: Genera Recetas ('unique data', Sergi Gomez + Joan Pina) procesa 3M+ recetas al año con ~70% de cuota del mercado digital. La capa SaaS (Nuzogan y Ebersy, con implementación de Acisclo Jr) añade compliance, módulo CO₂ y analytics para granjas — c.1M€ de EBITDA incremental.","metrics":[{"v":"+3M","l":"Recetas digitales al año"},{"v":"c.70%","l":"Cuota del mercado de receta digital"},{"v":"+20%","l":"Crecimiento revenue B2B online"},{"v":"c.1M€","l":"EBITDA incremental"}],"initiatives":[{"n":"Digital operating backbone","d":"ERP, WMS, CRM y logística como base del buy-and-build","p":"Joan Pina · Enric Peradejordi"},{"n":"Plataforma B2B online","d":"Canal digital que eleva revenue online y cesta media","p":"Iñaky Berzal · Yvonne Bayer"},{"n":"Receta electrónica","d":"300k+ recetas/mes, ~70% de cobertura de mercado","p":"Sergi Gomez · Joan Pina"},{"n":"SaaS, analytics & regulatorio","d":"Nuzogan y Ebersy: compliance, CO₂, pedidos y analytics","p":"Joan Pina · Acisclo Jr"}]},{"id":"kbv","excel":"Kbv","name":"Kitchen Bath Ventures","sector":"Consumer · Kitchen furniture","onePager":true,"tagline":"Convertir dealers independientes de cocina en una red de ventas digital","desc":"Uno de los grupos líderes de fabricación de cocinas en España, vendiendo a través de una red de pequeños dealers locales independientes.","arc":{"from":"2022 · Dealers fragmentados, procesos en papel","to":"2025 · Red digital: leads + CRM + presupuestador + analytics"},"narrative":"En KBV el reto no era digitalizar una empresa sino una red de cientos de dealers independientes. Tras el ERP assessment (Rebecca Tresserres) y el operating model (Francesc Corella) de 2021, Maria Parareda lidera desde 2022 la construcción de la plataforma OneStop del one-pager: Presupuestador (cotización en tiempo real contra catálogo y pricing vivos), Locator, Lead Generator (marketing centralizado que reparte leads cualificados a dealers) y CRM SaaS que sustituye el papel por gestión estructurada de pipeline, con desarrollo a medida de Evotic. El resultado: 90% de clientes en la plataforma, 200+ usuarios activos mensuales, +2M€ en presupuestos mensuales y +10% de pedidos totalmente digitales. En paralelo, sostenibilidad entra por el board (Montse Maresch) y la eficiencia industrial con Enric Peradejordi.","metrics":[{"v":"+90 p.p.","l":"Clientes usando OneStop (0→90%)"},{"v":"200+","l":"Usuarios activos mensuales"},{"v":"+2M€","l":"Presupuestos mensuales vía plataforma"},{"v":"+10%","l":"Pedidos mensuales 100% digitales"}],"initiatives":[{"n":"Digital Lead Gen","d":"Marketing centralizado que entrega leads cualificados a dealers locales","p":"Maria Parareda"},{"n":"CRM SaaS para dealers","d":"Del papel a pipeline estructurado para un modelo comercial eficiente","p":"Maria Parareda"},{"n":"Presupuestador digital","d":"Cotización en tiempo real integrada con catálogo y pricing vivos","p":"Maria Parareda · Evotic"},{"n":"Conversion Analytics","d":"Rendimiento por dealer y soporte automático a los rezagados","p":"Maria Parareda"}]},{"id":"pronokal","excel":"Pronokal","name":"PronoKal","sector":"Healthcare · Nutrición médica","onePager":true,"tagline":"De la prescripción analógica a un patient journey totalmente digital","desc":"Compañía líder en pérdida de peso médica y nutrición, con programas prescritos por médicos y seguimiento personalizado del paciente.","arc":{"from":"2017 · Venta vía prescriptores, baja visibilidad","to":"2022 · Plataforma conectada: app + dispositivos + plataforma del prescriptor"},"narrative":"PronoKal empieza por el board (advisory de salud con Josep Maria Payà y de estrategia con Félix Rivera, 2017) y por los cimientos: big data & analytics (Josep Maria Mingot), integración de add-ons (Andreu Puig) y nuevo centro logístico (Enric Peradejordi). Tras el Digital Day de 2018, Maria Parareda lidera en 2019 la construcción de todo el journey digital del one-pager: PronoKal Connect (la app del paciente: plan, progreso, peso — 22k clientes, con báscula inteligente conectada), MyPatients / Doctor Digital Platform (la plataforma del prescriptor: 73% de médicos activos y 86% de prescripciones digitales), el nuevo eCommerce y la capa de BI con Power BI que alimenta personalización, retención y adherencia. La telemedicina alcanza el 49% de adopción en 2022.","metrics":[{"v":"22k","l":"Clientes en PronoKal Connect"},{"v":"86%","l":"Prescripciones vía MyPatients"},{"v":"73%","l":"Prescriptores usando MyPatients"},{"v":"49%","l":"Adopción de telemedicina"}],"initiatives":[{"n":"PronoKal Connect","d":"App del paciente: seguir el plan, progreso y registro de peso","p":"Maria Parareda"},{"n":"MyPatients","d":"Plataforma del prescriptor: pacientes y prescripciones digitales","p":"Maria Parareda"},{"n":"Smart Scale","d":"Monitorización conectada y visibilidad de adherencia","p":"Maria Parareda"},{"n":"BI, AI & ML","d":"Personalización, retención y adherencia data-driven","p":"Josep Maria Mingot · Maria Parareda"}]},{"id":"isolana","excel":"Isolana","name":"Isolana","sector":"Distribución · Materiales construcción","onePager":true,"tagline":"De ejecución analógica a plataforma digital de servicio","desc":"Distribuidor de materiales de construcción y aislamiento, digitalizando un sector tradicionalmente analógico y fragmentado.","arc":{"from":"2019 · Ejecución analógica, dependiente de personas","to":"2021 · Plataforma digital de servicio: CRM + click & collect + WMS"},"narrative":"Isolana demuestra la aplicabilidad del playbook Fast Forward en sectores de distribución tradicional. 2019 pone las bases: finance capabilities (Carlos de la Fuente) y diagnóstico ERP (Rebecca Tresserres). En 2020 Joan Pina despliega en paralelo las tres piezas del one-pager: ForceManager CRM para la fuerza comercial de campo (del 0% al 80% de actividad comercial trazada, +10% de productividad estimada), Isolana Order (click & collect por WhatsApp, teléfono o atención al cliente, que recorta un 25% el tiempo de espera) y el WMS para visibilidad de stock y working capital (+15% de productividad de almacén). Completa el cuadro el recruitment digital (Joan Pina) y la agenda de sostenibilidad (Montse Maresch). Dos años para pasar de ejecución dependiente de personas a un modelo operativo digital y escalable.","metrics":[{"v":"+80 p.p.","l":"Actividad comercial trazada digitalmente"},{"v":"+10%","l":"Productividad comercial estimada"},{"v":"-25%","l":"Tiempo de espera del cliente"},{"v":"+15%","l":"Productividad de almacén estimada"}],"initiatives":[{"n":"ForceManager CRM","d":"Actividad de ventas de campo, prospección y follow-up","p":"Joan Pina"},{"n":"Isolana Order","d":"Click & collect vía WhatsApp, teléfono o customer service","p":"Joan Pina"},{"n":"WMS","d":"Visibilidad de stock, fulfilment y control de working capital","p":"Joan Pina"},{"n":"Modelo operativo digital","d":"Disciplina de ejecución escalable en toda la cadena de valor","p":"Joan Pina"}]},{"id":"agroponiente","excel":"Agroponiente","name":"Agroponiente","sector":"Agribusiness","onePager":true,"tagline":"Agroponiente 4.0: un sistema operativo agrícola potenciado por IA","desc":"Líder español en producción, manipulado y comercialización de frutas y hortalizas frescas.","arc":{"from":"2019 · Gestión de cultivos reactiva y manual","to":"Hoy · Operaciones agritech: datos de campo + IA predictiva + dashboards"},"narrative":"Agroponiente ilustra el modelo por capas: Capture → Integrate → Predict → Decide. La entrada (2019) asegura los fundamentos: ERP assessment (Rebecca Tresserres), reporting y budgeting (Carlos de la Fuente) y optimización de costes (Enric Peradejordi). En 2020 llega el modelo comercial y el Business Intelligence (Monica Perez) que unifica el dato. Sobre esa base se construye el sistema del one-pager: Hawk Eye (centro de control en tiempo real con IoT de cultivos, alertas de productividad y KPIs), Savian Human (captura estructurada de datos agronómicos por los operarios — 1,5M puntos de dato al día) y modelos de IA predictiva para riego, fertilización, sanidad vegetal y yield, además de gestión automatizada de siniestros desde ERP. La infraestructura se refuerza con el CPD (David Garriga) y la agenda ESG con Anna Ribalta (Sustainability Day, sesión de taxonomía).","metrics":[{"v":"1.5M","l":"Puntos de dato de campo al día"},{"v":"Real-time","l":"Estado de cultivo, alertas y KPIs"},{"v":"Predictivo","l":"Menor consumo de recursos (riego, fertilización)"},{"v":"Auto","l":"Precisión mejorada en estimación de siniestros"}],"initiatives":[{"n":"Hawk Eye","d":"Centro de control real-time: IoT de cultivo, alertas y KPIs en una vista","p":"Monica Perez · equipo FF"},{"n":"Savian Human","d":"Captura de datos agronómicos estructurados por operarios","p":"equipo FF"},{"n":"IA predictiva","d":"Optimización de riego, fertilización, sanidad y yield","p":"equipo FF"},{"n":"AI claims","d":"Estimación automática de riesgo financiero desde ERP y volúmenes","p":"equipo FF"}]},{"id":"btsa","excel":"Btsa","name":"BTSA","sector":"Natural Ingredients · B2B","onePager":true,"tagline":"Convertir la expansión comercial en un motor de crecimiento data-driven con IA","desc":"Especialista global en antioxidantes naturales, vitamina E e ingredientes funcionales para mercados B2B internacionales.","arc":{"from":"2022 · Inteligencia fragmentada, ventas manuales","to":"2025 · Motor IA: xNova + Salesforce + Imperia + contenido IA"},"narrative":"BTSA arranca como siempre: análisis de mercado pre-deal (Javier Solans, 2022), que continúa como board advisory. En 2023 se activan los cimientos — diagnóstico ERP (Rebecca Tresserres) y finance capabilities (Marcos Gómez) — y sobre ellos el motor comercial del one-pager: xNova, la inteligencia de trade con IA que ha analizado +2.250 importadores y mapeado $770M de volumen APAC, segmentando 365 y pasando 300 al equipo comercial; Salesforce CRM para visibilidad de funnel (conversión +13 p.p., del 2% al 15%); Imperia para NPI, planificación y working capital (ciclo NWC de 93 a 44 días, 2x más corto); y el motor de contenido técnico con IA para generación de demanda. El pipeline sigue vivo: modelo comercial-CRM (Josep Maria Piera) y deal gen (Iñaky Berzal) en evaluación.","metrics":[{"v":"+2,250","l":"Importadores analizados con xNova"},{"v":"+13 p.p.","l":"Conversión del funnel (2% → 15%)"},{"v":"2x","l":"Ciclo de working capital (93 → 44 días)"},{"v":"$770M","l":"Volumen APAC mapeado"}],"initiatives":[{"n":"xNova","d":"AI trade intelligence: importadores, distribuidores y competidores por geografía","p":"equipo FF"},{"n":"Salesforce CRM","d":"Funnel, conversión, pipeline y rendimiento comercial","p":"Josep Maria Piera (propuesta)"},{"n":"Imperia","d":"NPI, planificación operativa y control de working capital","p":"equipo FF"},{"n":"AI content engine","d":"Contenido técnico a escala para demanda y posicionamiento","p":"equipo FF"}]},{"id":"recalvi","excel":"Recalvi","name":"Recalvi","sector":"Automoción · Aftermarket","onePager":true,"tagline":"Una capa de inteligencia IA para crear valor desde el día uno","desc":"Plataforma de distribución de recambios de automoción compitiendo en un aftermarket fragmentado y rápido.","arc":{"from":"2025 · Fragmentado, visibilidad de gestión limitada","to":"2026 · Capa de inteligencia: reporting + insights + automatización + M&A"},"narrative":"Recalvi muestra el playbook Fast Forward más reciente: crear valor con IA desde antes del cierre. La due diligence (operacional con Guillermo Oliva, tech con Rebeca Tresserres, conocimiento sectorial de Josep Granyó) mapea los riesgos de integración antes del Day 1. Desde 2025, el proyecto AI for Documents (Juan Huguet) evoluciona hacia la capa de inteligencia del one-pager: reporting semanal board-ready de ventas, margen, clientes, zonas y marcas (de reporting mensual a visibilidad completa semanal, +100 p.p. de PoS cubiertos); una capa de insight comercial que detecta tendencias, desviaciones de margen y oportunidades por cliente; PoCs de automatización de pedidos que convierten mensajes de WhatsApp en órdenes estructuradas (+20 p.p. de PoS); y un playbook de M&A intelligence estrenado en el deal de Zoel.","metrics":[{"v":"+100 p.p.","l":"PoS con reporting y forecast mensual"},{"v":"Weekly","l":"Desviaciones por cliente, zona y marca"},{"v":"+20 p.p.","l":"PoS usando automatización IA de pedidos"},{"v":"Zoel","l":"Riesgos de integración mapeados pre-Day 1"}],"initiatives":[{"n":"AI reporting","d":"Insights semanales board-ready: ventas, margen, clientes, zonas, marcas","p":"Juan Huguet"},{"n":"Commercial insight layer","d":"Tendencias de venta, desviaciones de margen y oportunidades","p":"Juan Huguet"},{"n":"AI order automation","d":"PoCs: de WhatsApp a órdenes de compra estructuradas","p":"Juan Huguet"},{"n":"M&A intelligence playbook","d":"Assessment e integración de targets más rápidos (deal Zoel)","p":"equipo FF"}]},{"id":"grupodeincendios","excel":"Grupo De Incendios","name":"Grupo de Incendios","sector":"Industrials · Protección contra incendios","onePager":true,"tagline":"De sistemas legacy fragmentados a un backbone digital AI-ready para crecer","desc":"Diseñador, fabricante y distribuidor líder de sistemas de protección activa contra incendios.","arc":{"from":"2025 · Sistemas legacy fragmentados, trabajo manual","to":"2026 · Núcleo digital único: Navision + automatización IA + Cockpit"},"narrative":"Como Recalvi, Grupo de Incendios nace ya con el playbook AI-first: la due diligence operacional (Alberto Matamoros) y tech (Rebeca Tresserres) define el roadmap digital en 5 fases antes del cierre. El one-pager recoge la ejecución: Navision como backbone único (finanzas, compras, ventas, almacén, producción), WMS y S&OP para visibilidad de stock y disciplina de working capital, automatización IA de workflows (ofertas, informes, documentos, emails y órdenes de taller — el tiempo de crear una oferta cae de 7 a 2 días, 3x más rápido) y el CEO Cockpit, un briefing semanal con IA de KPIs, desviaciones y acciones recomendadas. El reporting financiero mensual pasa de 30 a 5 días (6x). Todo con ciclos de sprint IA de 2 semanas y un backbone M&A-ready para integrar adquisiciones futuras.","metrics":[{"v":"3x","l":"Más rápido crear una oferta (7→2 días)"},{"v":"6x","l":"Reporting financiero mensual (30→5 días)"},{"v":"2 sem","l":"Ciclo de sprint de automatización IA"},{"v":"M&A-ready","l":"Backbone escalable const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'');
const toks=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').split(/\s+/).filter(t=>t.length>1);
function lev1(a,b){if(a===b)return true;if(Math.abs(a.length-b.length)>1)return false;let i=0,j=0,e=0;while(i<a.length&&j<b.length){if(a[i]===b[j]){i++;j++;continue}if(++e>1)return false;if(a.length>b.length)i++;else if(b.length>a.length)j++;else{i++;j++}}return e+(a.length-i)+(b.length-j)<=1}
const tokMatch=(t,u)=>t===u||(t.length>2&&u.startsWith(t))||(u.length>2&&t.startsWith(u))||(t.length>3&&u.length>3&&lev1(t,u));
function nameMatch(n1,n2){const A=toks(n1),B=toks(n2);if(!A.length||!B.length)return false;const [S,L]=A.length<=B.length?[A,B]:[B,A];const used=new Set();let miss=null;
 for(const t of S){let f=-1;for(let i=0;i<L.length;i++){if(!used.has(i)&&tokMatch(t,L[i])){f=i;break}}if(f>=0)used.add(f);else{if(miss)return false;miss=t}}
 if(!miss)return true;if(S.length<2)return false;
 return L.some((u,i)=>!used.has(i)&&u.slice(0,3)===miss.slice(0,3))}

function fchip(group,val,label){const on=opsF[group]===val;return `<button class="filtbtn ${on?'on':''}" onclick="opsF['${group}']=opsF['${group}']==='${val}'?'':'${val}';drawOpsFilters();drawOps()">${label}</button>`}
function drawOpsFilters(){

 <div class="seclab">Estado · Rol · Colaboración</div><div>
  ${['Active LTM','Prospect (not tried yet)','Dormant','Sin ficha en Notion'].map(e=>fchip('estado',e,esc(e))).join('')}
  ${['Operating Partner','Senior Advisor'].map(r=>fchip('rol',r,esc(r))).join('')}
  ${fchip('collab','Hands On','Hands-on')}${fchip('collab','Hands Off','Advisory')}${fchip('collab','Interim','Interim')}${fchip('collab','Board','Board')}${fchip('collab','Full time','Full-time')}
 </div>`;
}
function opsMatch(p){
 if(opsF.area&&!(p.areas||[]).includes(opsF.area))return false;
 if(opsF.estado&&p.estado!==opsF.estado)return false;
 if(opsF.rol&&!(p.role||[]).includes(opsF.rol))return false;
 if(opsF.collab&&!(p.collab||[]).some(c=>c.indexOf(opsF.collab)>=0))return false;
 if(opsF.co&&!(p.cos||[]).includes(opsF.co)&&!(p.participadas||[]).some(x=>norm(x)===norm(opsF.co)))return false;
 if(opsF.tipo&&(p.tipo||'').toLowerCase().indexOf(opsF.tipo.toLowerCase())<0)return false;
 if(opsF.q){const hay=norm([p.name,p.org,p.cargo,p.ubicacion,p.bio,(p.capabilities||[]).join(' '),(p.tags||[]).join(' '),(p.sectores||[]).join(' '),(p.participadas||[]).join(' '),(p.cos||[]).map(coName).join(' '),(p.expertiseLegacy||[]).join(' '),(p.casos||[]).join(' ')].join(' '));
  if(!norm(opsF.q).split(/\s+/).filter(Boolean).every(w=>hay.indexOf(w)>=0))return false}
 return true}

 let list=DATA.partners.filter(opsMatch);

 list.sort(ord[opsF.sort]||ord.prj);

     :caps.length?`<div style="font-size:11.5px;color:#5B6675;line-height:1.5;margin:4px 0 2px">${caps.map(c=>'· '+esc(c)).join('<br>')}</div>`:''}
   <div class="foot">
    <span>${p.nprj?`<b style="color:#31404E">${p.nprj}</b> proyectos`:'sin proyectos aún'}</span>
    ${cos.length?`<span>${cos.slice(0,3).map(esc).join(', ')}${cos.length>3?' +'+(cos.length-3):''}</span>`:''}

function prjList(){
 return DATA.projects.filter(p=>{
  if(prjF.area&&p.area!==prjF.area)return false;
  if(prjF.co&&p.investee!==prjF.co)return false;
  if(prjF.status&&p.status!==prjF.status)return false;
  if(prjF.partner&&p.partnerKey!==prjF.partner)return false;
  if(prjF.year&&(!p.fecha||p.fecha.slice(0,4)!==prjF.year))return false;
  if(prjF.goal&&p.goal!==prjF.goal)return false;
  if(prjF.inv&&p.involvement!==prjF.inv)return false;
  if(prjF.q==='▸impact')return p.impact&&!p.impactEst;
  if(prjF.q){const hay=norm([p.name,p.partner,p.investee,coName(p.investee),p.goal,p.desc,p.impact,AREA[p.area].name].join(' '));
   if(!norm(prjF.q).split(/\s+/).filter(Boolean).every(w=>hay.indexOf(w)>=0))return false}
  return true}).sort((a,b)=>(a.fecha||'0000')<(b.fecha||'0000')?1:-1);
}
function drawPrj(){
 const list=prjList();
 const done=list.filter(p=>p.status==='Completed').length;
 const ong=list.filter(p=>p.status==='Ongoing').length;
 const pipe=list.length-done-ong;
 const wImp=list.filter(p=>p.impact&&!p.impactEst).length;
 $('prjStats').innerHTML=`
  <div class="stat"><div class="v">${list.length}</div><div class="l">Proyectos</div><div class="s">con los filtros actuales</div></div>
  <div class="stat" onclick="prjF.status=prjF.status==='Completed'?'':'Completed';renderPrj({...prjF})"><div class="v">${done}</div><div class="l">Completados</div><div class="s">track record</div></div>

async function saveGemKey(){const el=$('gemKey'),st=$('gemSt');const v=el.value.trim();
 try{if(v)localStorage.setItem('ff_gemini_key',v);else localStorage.removeItem('ff_gemini_key')}catch(e){}
 if(!v){st.textContent='Sin configurar';st.style.color='';return}
 st.textContent='Comprobando…';st.style.color='';

async function askGemini(prompt,key){
 const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key='+encodeURIComponent(key),{
  method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({contents:[{parts:[{text:prompt}]}],generationConfig:{temperature:0.2,responseMimeType:'application/json'}})});
 if(!r.ok)throw new Error('Gemini HTTP '+r.status);
 const j=await r.json();
 const t=j&&j.candidates&&j.candidates[0]&&j.candidates[0].content&&j.candidates[0].content.parts&&j.candidates[0].content.parts[0]&&j.candidates[0].content.parts[0].text;
 if(!t)throw new Error('Gemini sin respuesta');
 return t;
}

 (p.cos||[]).forEach(x=>{const c=companiesByExcel[x];if(c&&c.sector)own.push(c.sector)});
 return own}
const HINT={hands:['handson','hands','ejecucion','ejecutar','implantar','implantacion','implementar','operativo'],
 advis:['advisory','asesor','consejo','board','consejero','sparring'],
 interim:['interim','transicion','temporal','sustituir','provisional']};
function qwords(s){return String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').split(' ').filter(t=>t.length>1)}
const STOP=['para','una','uno','con','que','del','las','los','por','como','the','and','muy','sus','este','esta','nos','necesito','buscamos','busco','alguien','perfil','persona','empresa','compania','participada','abac','proyecto','tema','ayuda','poder','hacer','sobre','desde','entre','cero'];
function shortlist(q,n){
 const terms=[...new Set(qwords(q).filter(t=>!STOP.includes(t)))];
 const areasQ=[],capQ=[],sectQ=[];
 for(const ent of Object.entries(SYN)){const aid=ent[0],words=ent[1];
  if(terms.some(t=>words.some(w=>w===t||(t.length>4&&w.startsWith(t.slice(0,5)))||(w.length>4&&t.startsWith(w.slice(0,5))))))areasQ.push(aid)}
 terms.forEach(t=>{const R=ROLES[t];if(R){if(!areasQ.includes(R.a))areasQ.push(R.a);capQ.push.apply(capQ,R.cap)}});
 terms.forEach(t=>{for(const ent of Object.entries(SECT)){if(t.length>4&&t.startsWith(ent[0].slice(0,5))&&!sectQ.includes(ent[1]))sectQ.push(ent[1])}});
 const wantHands=terms.some(t=>HINT.hands.includes(t)),wantAdv=terms.some(t=>HINT.advis.includes(t)),wantInt=terms.some(t=>HINT.interim.includes(t));
 const scored=DATA.partners.map(p=>{
  const caps=norm((p.capabilities||[]).join(' ')+' '+(p.tags||[]).join(' ')+' '+(p.casos||[]).join(' '));
  const txt=norm([p.name,p.org,p.cargo,p.bio,(p.expertiseLegacy||[]).join(' '),(p.cos||[]).map(coName).join(' ')].join(' '));
  const sec=norm(pSectors(p).join(' '));
  const pa=p.areas||[];
  let s=0;const hits=[];
  areasQ.forEach(a=>{if(pa.includes(a)){s+=28;hits.push(AREA[a].short)}});
  capQ.forEach(c=>{if(caps.indexOf(norm(c))>=0){s+=16;hits.push(c)}});
  terms.forEach(t=>{if(t.length>3){if(caps.indexOf(t)>=0)s+=12;else if(txt.indexOf(t)>=0)s+=6}});
  sectQ.forEach(v=>{if(sec.indexOf(norm(v))>=0){s+=14;hits.push(v)}});
  const col=(p.collab||[]).join(' ');
  if(wantHands&&col.indexOf('Hands On')>=0)s+=10;
  if(wantAdv&&(col.indexOf('Hands Off')>=0||col.indexOf('Board')>=0))s+=10;
  if(wantInt&&col.indexOf('Interim')>=0)s+=14;
  if(s===0)return null;
  s+=Math.min(9,(p.nprj||0)*1.2);
  if(p.estado==='Active LTM')s+=5;
  return {p:p,s:s,hits:[...new Set(hits)]}}).filter(Boolean).sort((a,b)=>b.s-a.s);
 let list=scored;
 if(list.length<6&&areasQ.length){
  const extra=DATA.partners.filter(p=>!list.some(x=>x.p.key===p.key)&&(p.areas||[]).some(a=>areasQ.includes(a)))
   .sort((a,b)=>b.nprj-a.nprj).slice(0,10-list.length).map(p=>({p:p,s:1,hits:[]}));
  list=list.concat(extra)}
 return {list:list.slice(0,n),terms:terms,areasQ:areasQ,capQ:capQ,sectQ:sectQ}}
function engineName(){return hasCowork()?'Claude':gemKey()?'Gemini':'ranking local'}
async function runRec(){
 const q=$('recQ').value.trim();if(!q)return;
 const out=$('recOut');const btn=$('recBtn');btn.disabled=true;
 out.innerHTML='<div class="muted" style="font-size:13px"><span class="spin"></span>Analizando el directorio con '+engineName()+'…</div>';
 const S=shortlist(q,26);const list=S.list;
 const crit=[S.areasQ.map(a=>AREA[a].short).join(', '),S.sectQ.join(', ')].filter(Boolean).join(' · ');
 const compact=list.map(x=>{const p=x.p;return {k:p.key,n:p.name,e:p.estado,r:(p.role||[]).join('/'),
  a:(p.areas||[]).map(id=>AREA[id]?AREA[id].short:id).join(','),
  c:(p.capabilities||[]).slice(0,6).join('; ')||undefined,
  b:p.bio?p.bio.slice(0,170):undefined,
  x:(p.cos||[]).map(coName).join(',')||undefined,
  sec:[...new Set(pSectors(p))].slice(0,4).join(',')||undefined,
  np:p.nprj||0,col:(p.collab||[]).join('/')||undefined,carg:p.cargo||undefined}});
 const prompt='Eres el motor de recomendacion de operating partners de Abac Fast Forward (private equity, Espana).\n'
  +'NECESIDAD: "'+q+'"\n\n'
  +'CANDIDATOS preseleccionados del directorio. Campos: k=id, n=nombre, e=estado, r=rol, a=areas de expertise, c=capabilities etiquetadas, b=bio, x=participadas donde ya trabajo, sec=sectores (propios e inferidos de sus participadas), np=n proyectos, col=formatos de colaboracion, carg=cargo actual:\n'
  +JSON.stringify(compact)+'\n\n'
  +'Elige los 7 con MEJOR encaje, ordenados de mejor a peor. Criterios por orden: (1) las capabilities/areas etiquetadas cubren especificamente lo que se pide (si piden un CFO, deben tener capabilities de finanzas; no vale un perfil comercial con mucho track record); (2) el sector encaja; (3) el formato de colaboracion es compatible (hands-on / advisory / interim / full-time); (4) experiencia previa en participadas Abac; (5) estado (Active LTM preferible; Prospect vale si el encaje es mejor).\n'
  +'NUNCA recomiendes a alguien con encaje tematico debil solo porque tenga muchos proyectos. Si no hay 7 perfiles con encaje razonable, devuelve menos y explicalo en "gap".\n'
  +'En "why" cita la capability, el sector o el proyecto concreto que justifica el encaje.\n'
  +'Responde SOLO JSON valido, sin markdown: {"recs":[{"k":"<k exacta>","fit":<0-100>,"why":"<1-2 frases en espanol>"}],"gap":"<hueco del directorio en 1 frase, o cadena vacia>"}';
 const head='<div class="row" style="margin-bottom:10px;gap:8px"><span class="pill" style="background:#E7F6EE;color:#1F7A4D;margin:0">'+esc(engineName())+'</span><span class="muted" style="font-size:11.5px">'+list.length+' candidatos filtrados por etiquetas'+(crit?' · criterios detectados: '+esc(crit):'')+'</span></div>';
 try{
  const r=await askEngine(prompt);
  let txt=typeof r==='string'?r:(r&&(r.text||(r.content&&r.content[0]&&r.content[0].text)))||JSON.stringify(r);
  const m=txt.match(/\{[\s\S]*\}/);const j=JSON.parse(m?m[0]:txt);
  const byk={};list.forEach(x=>byk[x.p.key]=x.p);
  const recs=(j.recs||[]).map(x=>Object.assign({},x,{p:byk[x.k]||partnersByKey[x.k]||DATA.partners.find(p=>norm(p.name)===norm(x.k))})).filter(x=>x.p);
  out.innerHTML=head+(recs.map((x,i)=>`
   <div class="rec ${i===0?'top':''}">
    <div class="row" style="gap:11px">
     <div class="rank ${i===0?'g':''}">${i+1}</div>
     <div style="min-width:0;flex:1">
      <div class="between"><span class="link" style="font-size:14.5px" onclick="openPartner('${x.p.key}')">${esc(x.p.name)}</span>${estBadge(x.p.estado)}</div>
      <div style="margin:5px 0 7px">${areaPills(x.p.areas,4)}</div>
      <div style="font-size:12.5px;color:#3C4956;line-height:1.6">${esc(x.why)}</div>
      ${(x.p.capabilities||[]).length?`<div class="muted" style="font-size:11px;margin-top:6px">${x.p.capabilities.slice(0,3).map(esc).join(' · ')}</div>`:''}
      ${x.p.nprj?`<div class="muted" style="font-size:11px;margin-top:3px">${x.p.nprj} proyectos FF${(x.p.cos||[]).length?' · '+x.p.cos.map(coName).map(esc).join(', '):''}</div>`:''}
      <div class="row" style="margin-top:8px;gap:10px"><div class="bar"><i style="width:${Math.max(5,Math.min(100,x.fit))}%"></i></div><span class="fitn">${x.fit}</span></div>
     </div>
    </div>
   </div>`).join('')||'<div class="muted">Sin recomendaciones. Prueba a reformular la necesidad.</div>')
  +(j.gap?`<div class="note"><b>Gap del directorio:</b> ${esc(j.gap)}</div>`:'')
  +`<div class="row" style="margin-top:14px"><button class="btn ghost mini" onclick="extSearch()">Buscar perfiles externos (prepara prompt para el chat)</button></div><div id="extOut" style="margin-top:10px"></div>`;
 }catch(e){
  console.error('askEngine failed',e);
  const msg=(e&&e.message)||'error';
  let why;
  if(msg==='no-engine')why='Sin motor de IA configurado — ranking por etiquetas. Anade una API key de Gemini en el recuadro inferior para activar la IA.';
  else if(msg.indexOf('401')>=0)why='<b>Clave de Gemini no valida (401).</b> Vuelve a copiarla con el boton de copiar de <a href="https://aistudio.google.com/apikey" target="_blank">aistudio.google.com/apikey</a> (no selecciones el texto oculto de la tabla) y guardala de nuevo. Si persiste, crea una clave nueva desde ese mismo sitio. Mientras tanto: ranking por etiquetas.';
  else if(msg.indexOf('403')>=0)why='<b>Clave rechazada (403).</b> Suele deberse a restricciones de la clave por dominio: al abrir el archivo en local no se envia dominio, asi que la clave debe estar sin restricciones (o usarse desde el dominio autorizado). Mientras tanto: ranking por etiquetas.';
  else if(msg.indexOf('429')>=0)why='<b>Cuota agotada (429).</b> Se ha superado el limite gratuito de Gemini (se reinicia cada dia). Mientras tanto: ranking por etiquetas.';
  else why='El motor de IA no ha respondido ('+msg+') — ranking por etiquetas.';
  out.innerHTML=head+`<div class="note" style="margin-top:0;margin-bottom:12px">${why}</div>`+
   list.slice(0,7).map((x,i)=>`<div class="rec ${i===0?'top':''}"><div class="row" style="gap:11px"><div class="rank ${i===0?'g':''}">${i+1}</div>
    <div style="flex:1"><div class="between"><span class="link" style="font-size:14.5px" onclick="openPartner('${x.p.key}')">${esc(x.p.name)}</span>${estBadge(x.p.estado)}</div>
    <div style="margin-top:5px">${areaPills(x.p.areas,4)}</div>
    ${x.hits&&x.hits.length?`<div style="font-size:11.5px;color:#0E7A8A;margin-top:6px">Coincide en: ${x.hits.slice(0,4).map(esc).join(' · ')}</div>`:''}
    ${(x.p.capabilities||[]).length?`<div class="muted" style="font-size:11px;margin-top:4px">${x.p.capabilities.slice(0,3).map(esc).join(' · ')}</div>`:''}
    ${x.p.nprj?`<div class="muted" style="font-size:11px;margin-top:3px">${x.p.nprj} proyectos FF${(x.p.cos||[]).length?' · '+x.p.cos.map(coName).map(esc).join(', '):''}</div>`:''}
    </div></div></div>`).join('')
   +`<div class="row" style="margin-top:14px"><button class="btn ghost mini" onclick="extSearch()">Buscar perfiles externos (prepara prompt para el chat)</button></div><div id="extOut" style="margin-top:10px"></div>`;
 }
 btn.disabled=false;
}

/* ============ NOTION SYNC ============ */
const NOTION_TOOL='mcp__bf52c5ea-1b01-473c-b463-7710022cd23d__notion-query-data-sources';
const DS='collection://2ea3d4b9-e254-8179-9443-000bb1f89db4';
const EXPMAP={'revenue and operational excellence':['commercial','ops'],'technology & science':['tech','data_ai'],'strategy':['strategy'],'digital business development':['digital'],'people':['talent'],'sustainability':['esg']};
function parseArr(s){if(!s)return[];try{const a=JSON.parse(s);return Array.isArray(a)?a:[]}catch(e){return[]}}
async function syncNotion(){
 const chip=$('syncChip'),txt=$('syncTxt');
 try{
  const r=await window.cowork.callMcpTool(NOTION_TOOL,{data:{data_source_urls:[DS],query:`SELECT url, "Operating Partner", "Estado", "Role", "Expertise", "Casos de uso", "Collaboration Model", "Sector", "Seniority", "Geografía", "Fase", "LinkedIn", "E-mail - Trabajo", "Confianza", "Type", "Nombre persona Contacto" FROM "${DS}" LIMIT 500`}});
  if(r.isError)throw new Error('notion error');
  let payload=r.structuredContent;
  if(!payload){const t=r.content&&r.content[0]&&r.content[0].text;payload=t?JSON.parse(t):null}
  const rows=(payload&&payload.results)||[];
  let added=0,updated=0;
  rows.forEach(row=>{
   const name=(row['Operating Partner']||'').trim();if(!name)return;
   const k=norm(name);
   const casos=parseArr(row['Casos de uso']);
   const exps=parseArr(row['Expertise']);
   const areasN=[...new Set(exps.flatMap(e=>EXPMAP[e.toLowerCase()]||[]))];
   let p=partnersByKey[k]||DATA.partners.find(x=>x.key.indexOf(k)>=0||k.indexOf(x.key)>=0)||DATA.partners.find(x=>nameMatch(x.name,name));
   if(p){ /* enriquecer con lo que Notion tenga más fresco */
    if(p.ghost){p.ghost=false;p.fromNotion=true;p.name=name;p.notas='';if(row['Type'])p.tipo=row['Type'];if(parseArr(row['Role']).length)p.role=parseArr(row['Role']);if(parseArr(row['Collaboration Model']).length)p.collab=parseArr(row['Collaboration Model'])}
    if(row['Estado'])p.estado=row['Estado'];
    if(row['LinkedIn']&&!p.linkedin)p.linkedin=row['LinkedIn'];
    if(row['E-mail - Trabajo']&&!p.email)p.email=row['E-mail - Trabajo'];
    if(casos.length)p.casos=casos;
    areasN.forEach(a=>{if(!(p.areas||[]).includes(a))p.areas.push(a)});
    p.notionUrl=row.url;updated++;
   }else{
    DATA.partners.push({key:k,name,estado:row['Estado']||'Sin estado',tipo:row['Type']||'',role:parseArr(row['Role']),collab:parseArr(row['Collaboration Model']),expertiseLegacy:exps,areas:areasN,capabilities:[],tags:[],sectores:parseArr(row['Sector']),fases:parseArr(row['Fase']),cargo:'',email:row['E-mail - Trabajo']||'',linkedin:row['LinkedIn']||'',org:'',web:'',ubicacion:(parseArr(row['Geografía'])).join(', '),compensacion:'',notas:'',participadas:[],casos,fromNotion:true,notionUrl:row.url,nprj:0,cos:[],since:'',until:'',bio:''});
    partnersByKey[k]=DATA.partners[DATA.partners.length-1];added++;
   }});
  chip.classList.add('ok');txt.textContent=`Notion · ${rows.length} partners sincronizados${added?` (+${added} nuevos)`:''}`;
  if(CUR==='ops')drawOps();if(CUR==='home')renderHome();
 }catch(e){console.error('sync',e);chip.classList.add('err');txt.textContent='Notion sin conexión · usando datos locales'}
}

renderHome();
syncNotion();
