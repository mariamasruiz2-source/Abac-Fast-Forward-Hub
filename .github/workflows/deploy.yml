name: Deploy Fast Forward Hub to Pages

# Publica index.html en GitHub Pages inyectando la API key de Gemini desde el
# secreto del repositorio. La clave NUNCA se guarda en el codigo: vive cifrada
# en Settings > Secrets and variables > Actions > GEMINI_API_KEY

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Inyectar la API key en el HTML
        env:
          KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p site
          python3 -c "import os, io; k = os.environ.get('KEY', '').strip(); s = io.open('index.html', encoding='utf-8').read(); print('Placeholders encontrados:', s.count('__GEMINI_KEY__')); print('Clave presente:', 'si' if k else 'NO - se desplegara sin clave'); io.open('site/index.html', 'w', encoding='utf-8').write(s.replace('__GEMINI_KEY__', k))"
          if grep -q "__GEMINI_KEY__" site/index.html; then
            echo "::error::Ha quedado algun placeholder sin sustituir"
            exit 1
          fi
          echo "HTML listo para publicar"

      - name: Preparar el artefacto de Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar en GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
